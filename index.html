<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>STC MQ-Accounting | EXECUTIVE BOARD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@900&family=Noto+Sans+JP:wght@900&display=swap');
        body { background-color: #0f172a; color: #1e293b; font-family: 'Inter', 'Noto Sans JP', sans-serif; overflow: hidden; }
        
        /* 巨大MQ図：視認性MAX */
        .mq-grid { display: grid; grid-template-columns: 200px 140px 300px; grid-template-rows: 70px 140px 70px; gap: 12px; }
        .mq-box { border: 4px solid #000; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: white; box-shadow: 8px 8px 0px #000; }
        .box-pq { grid-row: 1/4; background: #eff6ff; }
        .box-vq { grid-column: 2/4; background: #fff1f2; }
        .box-mq { grid-row: 2/4; background: #ffffff; }
        .box-f  { background: #fefce8; }
        .box-g  { background: #f0fdf4; }

        /* PVMQ正式レイアウト：画像再現 */
        .pvmq-formal { display: flex; align-items: center; gap: 0; }
        .pvm-unit { display: grid; grid-template-columns: 160px 160px; grid-template-rows: 80px 80px; border: 4px solid #000; background: #000; gap: 4px; }
        .pv-cell { background: white; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        .cell-p { grid-row: 1/3; }
        .cell-v { background: #f8fafc; }
        .symbol-x { font-size: 3rem; font-weight: 900; padding: 0 30px; color: #fff; }
        .q-frame { width: 130px; height: 164px; border: 4px solid #000; background: white; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        
        .label-tag { position: absolute; top: 6px; left: 10px; font-size: 1rem; font-weight: 900; color: #94a3b8; }
        .num-xl { font-size: 2.2rem; font-weight: 900; color: #000; }

        .sidebar-input { width: 100%; text-align: right; border-bottom: 2px solid #334155; font-weight: 700; color: #fff; background: transparent; outline: none; }
        .active-btn { background: #3b82f6 !important; color: white !important; }
        .stc-input { background: #1e293b; border: 1px solid #334155; border-radius: 6px; padding: 4px; width: 60px; text-align: center; }
    </style>
</head>
<body class="flex h-screen">

    <!-- サイドバー -->
    <aside class="w-[450px] bg-[#0f172a] text-white p-8 flex flex-col shadow-2xl z-20 overflow-y-auto">
        <h1 class="text-3xl font-black italic tracking-tighter mb-10 border-b-4 border-blue-600 pb-2">MANAGEMENT</h1>

        <!-- 1. CSV取込 -->
        <div class="mb-8 p-6 bg-slate-800 rounded-3xl border border-slate-700">
            <p class="text-[11px] font-black text-blue-400 mb-3 uppercase tracking-widest">CSV Data Import</p>
            <input type="file" id="csvFile" class="text-xs w-full file:bg-blue-600 file:text-white file:border-0 file:rounded-full file:px-4 file:py-2 cursor-pointer">
        </div>

        <!-- 2. 部門切替 -->
        <div class="grid grid-cols-3 gap-2 mb-10">
            <button onclick="switchDept('koubai')" id="b-koubai" class="py-3 text-[11px] font-black rounded-xl border border-slate-700 active-btn transition-all">購買課</button>
            <button onclick="switchDept('shikaku')" id="b-shikaku" class="py-3 text-[11px] font-black rounded-xl border border-slate-700 transition-all">資格教育</button>
            <button onclick="switchDept('total')" id="b-total" class="py-3 text-[11px] font-black rounded-xl border border-slate-700 italic transition-all">合計</button>
        </div>

        <!-- 3. STC入力 (資格教育時のみ) -->
        <div id="stcTool" class="mb-10 p-6 bg-blue-900 rounded-[30px] hidden shadow-2xl">
            <h3 class="text-sm font-black mb-4 flex justify-between">STC 受講者数 <span class="text-blue-300">Q入力</span></h3>
            <div class="grid grid-cols-1 gap-3 text-xs">
                <div class="flex justify-between">玉掛: <input type="number" id="q_1" class="stc-input" value="71"></div>
                <div class="flex justify-between">クレーン: <input type="number" id="q_2" class="stc-input" value="35"></div>
                <div class="flex justify-between">フォーク: <input type="number" id="q_3" class="stc-input" value="0"></div>
                <div class="flex justify-between border-t border-blue-700 pt-3 font-black text-lg">
                    <span>合計Q:</span><span id="q_total" class="text-blue-300">106</span>
                </div>
            </div>
        </div>

        <!-- 4. PL科目入力 -->
        <div class="space-y-6">
            <p class="text-[11px] font-black text-slate-500 border-b border-slate-800 pb-2 uppercase tracking-widest">Financial Data</p>
            <div class="space-y-4">
                <div class="flex justify-between items-center text-sm font-bold"><span>売上高</span><input type="number" id="v_rev" class="sidebar-input w-36"></div>
                <div class="flex justify-between items-center text-sm font-bold"><span>変動費</span><input type="number" id="v_mat" class="sidebar-input w-36 text-red-400"></div>
                <div class="flex justify-between items-center text-sm font-bold"><span>固定費</span><input type="number" id="v_fix" class="sidebar-input w-36 text-amber-400"></div>
            </div>
        </div>

        <button onclick="save()" class="w-full bg-blue-600 hover:bg-blue-500 text-white py-6 rounded-3xl font-black text-xl shadow-2xl mt-10 transition-all">
            クラウド同期保存
        </button>
    </aside>

    <!-- メイン -->
    <main class="flex-1 p-8 lg:p-12 overflow-hidden flex flex-col">
        <div class="max-w-[1200px] mx-auto w-full h-full flex flex-col">
            
            <header class="flex justify-between items-end mb-10 text-white">
                <div>
                    <h2 class="text-7xl font-black tracking-tighter" id="headDept">121 購買課管理</h2>
                    <div class="flex gap-4 mt-4">
                        <select id="selY" class="bg-transparent font-black text-slate-400 outline-none cursor-pointer"><option value="2025">2024年度(2506期)</option></select>
                        <select id="selM" class="bg-transparent font-black text-slate-400 outline-none cursor-pointer"><option value="total">期累計(決算)</option></select>
                    </div>
                </div>
                <div class="text-right flex items-center gap-10">
                    <div><p class="text-xs font-black text-slate-400 mb-1">MQ RATIO</p><p class="text-5xl font-black text-blue-400"><span id="mqRate">0</span>%</p></div>
                    <div class="bg-blue-600 p-8 rounded-[40px] shadow-2xl"><p class="text-xs font-black opacity-70 mb-1">PROFIT (G)</p><p class="text-6xl font-black" id="totalG">¥0</p></div>
                </div>
            </header>

            <!-- メインボード -->
            <div class="bg-white rounded-[60px] p-16 shadow-2xl flex-1 flex flex-col items-center justify-center relative overflow-hidden">
                <div class="absolute inset-0 opacity-5 pointer-events-none" style="background-image: radial-gradient(#000 2px, transparent 2px); background-size: 30px 30px;"></div>
                
                <!-- MQ図：巨大化 -->
                <div class="mq-grid scale-125 mb-24">
                    <div class="mq-box box-pq"><span class="text-xl font-black mb-2">PQ</span><span class="text-4xl font-black" id="dPQ">0</span></div>
                    <div class="mq-box box-vq"><span class="text-xl font-black mb-2 text-red-500">VQ</span><span class="text-4xl font-black text-red-500" id="dVQ">0</span></div>
                    <div class="mq-box box-mq"><span class="text-xl font-black mb-2 text-blue-600">MQ</span><span class="text-4xl font-black text-blue-600" id="dMQ">0</span></div>
                    <div class="mq-box box-f"><span class="text-xl font-black mb-2 text-slate-500">F</span><span class="text-4xl font-black text-slate-500" id="dF">0</span></div>
                    <div class="mq-box box-g"><span class="text-xl font-black mb-2 text-green-600">G</span><span class="text-4xl font-black text-green-600" id="dG">0</span></div>
                </div>

                <!-- PVMQ図：巨大化 -->
                <div class="pvmq-formal scale-150 mt-10">
                    <div class="pvm-unit shadow-2xl">
                        <div class="pv-cell cell-p"><span class="label-tag">P</span><span id="vP" class="num-xl">0</span></div>
                        <div class="pv-cell cell-v"><span class="label-tag text-red-400">V</span><span id="vV" class="text-2xl font-black text-red-500">0</span></div>
                        <div class="pv-cell cell-m"><span class="label-tag text-blue-400">M</span><span id="vM" class="text-2xl font-black text-blue-600">0</span></div>
                    </div>
                    <div class="symbol-x">×</div>
                    <div class="q-frame shadow-2xl">
                        <span class="text-xs font-black text-slate-400 mb-2 uppercase">Quantity</span>
                        <span id="vQ" class="text-6xl font-black">106</span>
                    </div>
                </div>
            </div>

            <!-- 下段グラフ：コンパクトに配置 -->
            <div class="grid grid-cols-2 gap-8 mt-8 h-48">
                <div class="bg-white/10 rounded-[40px] p-6 border border-white/10 flex flex-col">
                    <canvas id="mainChart"></canvas>
                </div>
                <div class="bg-white/10 rounded-[40px] p-8 text-white/50 text-sm italic">
                    Meeting Insights: 決定事項や分析をメモ...
                </div>
            </div>
        </div>
    </main>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAvK-_h5NzDJcyPDJgb-iddYdscYaUivto",
        authDomain: "mq-accounting-221b3.firebaseapp.com",
        projectId: "mq-accounting-221b3",
        storageBucket: "mq-accounting-221b3.firebasestorage.app",
        messagingSenderId: "684182333946",
        appId: "1:684182333946:web:b9406d2ee2ceb838211c43"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let curD = "koubai"; let allD = {};
    const chart = new Chart(document.getElementById('mainChart'), {
        type: 'bar',
        data: { labels: ['購買', '資格', '合計'], datasets: [{label:'G', data:[0,0,0], backgroundColor:'#4ade80', borderRadius:20}]},
        options: { responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{y:{display:false},x:{grid:{display:false},ticks:{color:'#fff'}}}}
    });

    onSnapshot(doc(db, "mq_final_pro", "master"), (snap) => {
        if(snap.exists()) { allD = snap.data(); refresh(); }
    });

    window.refresh = function() {
        const data = allD[curD] || {};
        document.getElementById('stcTool').style.display = (curD==='shikaku'?'block':'none');
        document.getElementById('v_rev').value = data.pq || 0;
        document.getElementById('v_mat').value = data.vq || 0;
        document.getElementById('v_fix').value = data.f || 0;
        
        const pq = parseInt(document.getElementById('v_rev').value)||0;
        const vq = parseInt(document.getElementById('v_mat').value)||0;
        const f = parseInt(document.getElementById('v_fix').value)||0;
        const q = (parseInt(document.getElementById('q_1').value)||0) + (parseInt(document.getElementById('q_2').value)||0) + (parseInt(document.getElementById('q_3').value)||0) || 1;
        
        const mq = pq-vq; const g = mq-f;
        document.getElementById('dPQ').innerText = pq.toLocaleString();
        document.getElementById('dVQ').innerText = vq.toLocaleString();
        document.getElementById('dMQ').innerText = mq.toLocaleString();
        document.getElementById('dF').innerText = f.toLocaleString();
        document.getElementById('dG').innerText = g.toLocaleString();
        document.getElementById('totalG').innerText = '¥'+g.toLocaleString();
        document.getElementById('mqRate').innerText = pq>0?Math.round((mq/pq)*100):0;
        document.getElementById('vQ').innerText = q.toLocaleString();
        document.getElementById('q_total').innerText = q;
        document.getElementById('vP').innerText = Math.round(pq/q).toLocaleString();
        document.getElementById('vV').innerText = Math.round(vq/q).toLocaleString();
        document.getElementById('vM').innerText = Math.round(mq/q).toLocaleString();

        chart.data.datasets[0].data = [ (allD.koubai?.pq-allD.koubai?.vq)-allD.koubai?.f || 0, (allD.shikaku?.pq-allD.shikaku?.vq)-allD.shikaku?.f || 0, (allD.total?.pq-allD.total?.vq)-allD.total?.f || 0 ];
        chart.update();
    }

    window.switchDept = (d) => {
        curD = d;
        document.querySelectorAll('#deptTabs button').forEach(b=>b.classList.remove('active-btn'));
        document.getElementById('b-'+d).classList.add('active-btn');
        document.getElementById('headDept').innerText = (d==='koubai'?'121 購買課管理':d==='shikaku'?'122 資格教育':'12 部門合計');
        refresh();
    }

    window.save = async () => {
        allD[curD] = { pq:parseInt(document.getElementById('v_rev').value), vq:parseInt(document.getElementById('v_mat').value), f:parseInt(document.getElementById('v_fix').value), q:parseInt(document.getElementById('q_total').innerText)};
        await setDoc(doc(db, "mq_final_pro", "master"), allD);
        alert("クラウド保存完了");
    }

    document.querySelectorAll('input').forEach(i=>i.oninput=refresh);
    switchDept('koubai');
</script>
</body>
</html>
