<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQ会計ダッシュボード - 株式会社コプロス</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary: #1e40af; --success: #10b981; --danger: #ef4444; --fixed: #94a3b8;
            --bg: #f3f4f6; --card: #ffffff; --border: #1f2937;
            --mq-pq: #f0f7ff; --mq-vq: #fef2f2; --mq-mq: #ffffff; --mq-f: #f8fafc; --mq-g: #ecfdf5;
        }

        body { font-family: "Hiragino Sans", "Meiryo", sans-serif; background: var(--bg); color: #111827; margin: 0; padding: 15px; }
        .container { max-width: 1850px; margin: 0 auto; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card); padding: 15px 30px; border-radius: 12px; 
            border-bottom: 5px solid var(--primary); margin-bottom: 15px;
        }
        .header-title h1 { margin: 0; font-size: 26px; font-weight: 900; color: var(--primary); }

        .dashboard-grid { display: grid; grid-template-columns: 420px 1fr 450px; gap: 20px; align-items: start; }
        .card { background: var(--card); border-radius: 15px; padding: 20px; border: 1px solid #e5e7eb; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        /* 左カラム：操作エリア */
        .tab-btn { flex: 1; padding: 10px; border: none; background: #e5e7eb; cursor: pointer; font-weight: 800; border-radius: 6px; font-size: 12px; }
        .tab-btn.active { background: var(--primary); color: white; }
        .pl-scroll { height: 400px; overflow-y: scroll; border: 1px solid #f3f4f6; margin-bottom: 15px; }
        
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        td { padding: 6px 8px; border-bottom: 1px solid #f3f4f6; }
        .tag { font-size: 9px; padding: 2px 4px; border-radius: 3px; font-weight: 900; margin-right: 5px; }
        .tag-p { background: #dbeafe; color: #1e40af; } .tag-v { background: #fee2e2; color: #b91c1c; } .tag-f { background: #f3f4f6; color: #475569; }

        /* 資格教育 Q入力パネル */
        .q-panel { background: #eff6ff; padding: 15px; border-radius: 10px; border: 2px solid #bfdbfe; margin-bottom: 15px; }
        .q-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 8px; }
        .q-input-item { text-align: center; }
        .q-input-item label { font-size: 10px; font-weight: 800; color: var(--primary); display: block; margin-bottom: 2px; }
        .q-input-item input { width: 80%; border: 1px solid #7dd3fc; border-radius: 4px; text-align: center; font-weight: bold; }

        /* 中央：巨大ビジュアル */
        .main-visual { display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .mq-table {
            display: grid; grid-template-columns: 220px 160px 220px;
            grid-template-rows: repeat(3, 110px); border: 4px solid var(--border); background: white;
        }
        .mq-c { border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .mq-c span { font-size: 12px; font-weight: bold; color: #64748b; margin-bottom: 8px; }
        .mq-c strong { font-size: 1.8rem; font-weight: 900; }

        .kpi-row { display: flex; gap: 20px; margin-bottom: 10px; }
        .kpi-box { background: #fff; border: 2px solid var(--primary); padding: 10px 30px; border-radius: 12px; text-align: center; min-width: 180px; box-shadow: 0 4px 0 var(--primary); }

        /* PVMQシミュレーター */
        .pvmq-box { display: flex; align-items: center; gap: 15px; padding: 20px; background: white; border-radius: 15px; border: 1px solid #e5e7eb; }
        .pvm-grid { display: grid; grid-template-columns: 130px 130px; grid-template-rows: 70px 70px; border: 3px solid var(--border); }
        .q-block { border: 3px solid var(--border); width: 90px; height: 140px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #eff6ff; }

        /* 貼り付けエリア（隠し/出し） */
        .import-panel { background: #f8fafc; padding: 10px; border: 1px dashed #cbd5e1; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-title"><h1>MQ会計ダッシュボード</h1></div>
        <div class="controls">
            <label style="font-weight:bold;">年度:</label>
            <select id="yearSel"><option value="2025">2025年度</option></select>
            <label style="font-weight:bold; margin-left:10px;">月:</label>
            <select id="monthSel" onchange="calculate()"><option value="3">3月</option><option value="6">6月</option></select>
            <select id="calcType" onchange="calculate()" style="margin-left:10px;"><option value="発生">発生値</option><option value="累計">累計値</option></select>
        </div>
    </header>

    <div class="dashboard-grid">
        <!-- 左側：入力と設定 -->
        <section>
            <div style="display:flex; gap:5px; margin-bottom:12px;">
                <button class="tab-btn active" onclick="setDept('121', this)">121 購買課</button>
                <button class="tab-btn" onclick="setDept('122', this)">122 資格教育</button>
                <button class="tab-btn" onclick="setDept('Total', this)">部門合計</button>
            </div>
            
            <div class="card">
                <div class="pl-scroll"><table><tbody id="pl-body"></tbody></table></div>
                
                <!-- 資格教育 Q入力パネル（勘定科目の下） -->
                <div id="q-panel" class="q-panel" style="display:none;">
                    <span style="font-size:11px; font-weight:900; color:var(--primary);">講習数(Q)内訳入力</span>
                    <div class="q-grid">
                        <div class="q-input-item"><label>玉掛</label><input type="number" class="qin" value="32" oninput="calculate()"></div>
                        <div class="q-input-item"><label>クレーン</label><input type="number" class="qin" value="15" oninput="calculate()"></div>
                        <div class="q-input-item"><label>フォーク</label><input type="number" class="qin" value="60" oninput="calculate()"></div>
                        <div class="q-input-item"><label>テール</label><input type="number" class="qin" value="5" oninput="calculate()"></div>
                        <div class="q-input-item"><label>ハネス</label><input type="number" class="qin" value="4" oninput="calculate()"></div>
                    </div>
                </div>

                <button class="btn-sync" style="background:var(--success); color:white; border:none; padding:15px; width:100%; border-radius:10px; font-weight:900; cursor:pointer;" onclick="syncToFirebase()">
                    クラウド同期保存
                </button>

                <div class="import-panel">
                    <span style="font-size:10px; color:#64748b;">Excelデータを貼り付け:</span>
                    <textarea id="pasteArea" style="width:100%; height:40px; font-size:10px; margin:5px 0;"></textarea>
                    <button onclick="importFromPaste()" style="width:100%; font-size:11px; cursor:pointer;">貼り付け実行</button>
                </div>
            </div>
        </section>

        <!-- 中央：大型MQ図 -->
        <section class="main-visual">
            <div class="kpi-row">
                <div class="kpi-box"><span>MQ比率</span><strong id="id-ratio">0.0%</strong></div>
                <div class="kpi-box"><span>損益分岐点</span><strong id="id-be">¥0</strong></div>
            </div>
            <div class="mq-table">
                <div class="mq-c" style="grid-row:span 3; background:var(--mq-pq);"><span>売上 PQ</span><strong id="m-pq">0</strong></div>
                <div class="mq-c" style="grid-column:span 2; background:var(--mq-vq);"><span>変動費 VQ</span><strong id="m-vq" style="color:var(--danger)">0</strong></div>
                <div class="mq-c" style="grid-row:span 2; background:var(--mq-mq);"><span>付加価値 MQ</span><strong id="m-mq">0</strong></div>
                <div class="mq-c" style="background:var(--mq-f);"><span>固定費 F</span><strong id="m-f">0</strong></div>
                <div class="mq-c" id="g-box"><span>利益 G</span><strong id="m-g">0</strong></div>
            </div>

            <div class="pvmq-box">
                <div class="pvm-grid">
                    <div class="mq-c" style="grid-row:span 2; border:1px solid var(--border);"><span>P (単価)</span><strong id="v-p">0</strong></div>
                    <div class="mq-c" style="background:var(--mq-vq); border:1px solid var(--border);"><span>V (変動)</span><strong id="v-v" style="color:var(--danger)">0</strong></div>
                    <div class="mq-c" style="border:1px solid var(--border);"><span>M (利益)</span><strong id="v-m">0</strong></div>
                </div>
                <div style="font-size:32px; font-weight:bold; color:#cbd5e1;">×</div>
                <div class="q-block"><span>Q (数量)</span><strong id="v-q">0</strong></div>
                <div style="font-size:32px; font-weight:bold; color:#cbd5e1;">=</div>
                <div style="padding-left:15px;"><span>MQ合計</span><br><strong style="font-size:2.2rem; color:var(--primary);" id="v-mq">0</strong></div>
            </div>
        </section>

        <!-- 右側：グラフ -->
        <section>
            <div class="card" style="margin-bottom:20px; height: 350px;">
                <canvas id="stChart"></canvas>
            </div>
            <div class="card" style="height: 300px;">
                <canvas id="prChart"></canvas>
            </div>
        </section>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyAvK-_h5NzDjCYPdJgb-iddYdscYaUivto", authDomain: "mq-accounting-221b3.firebaseapp.com", projectId: "mq-accounting-221b3", storageBucket: "mq-accounting-221b3.appspot.com", messagingSenderId: "684182333946", appId: "1:684182333946:web:b9406d2ee2ceb8382b11c43" };
    firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

    const masterAccounts = [
        { name: "兼業事業売上高", type: "売上" }, { name: "内部振替収入", type: "売上" },
        { name: "材料費", type: "変動" }, { name: "労務費", type: "変動" }, { name: "外注費", type: "変動" },
        { name: "安全費", type: "固定" }, { name: "技術管理費", type: "固定" }, { name: "機械等経費", type: "固定" },
        { name: "従業員給料手当", type: "固定" }, { name: "法定福利費", type: "固定" }, { name: "燃料費", type: "固定" },
        { name: "減価償却費", type: "固定" }, { name: "租税公課", type: "固定" }, { name: "保険料", type: "固定" }, { name: "支払手数料", type: "固定" }
    ];

    let currentDept = '121', dbData = {}, charts = {};

    function importFromPaste() {
        const text = document.getElementById('pasteArea').value;
        const lines = text.split('\n');
        let count = 0;
        lines.forEach(line => {
            const cells = line.split('\t');
            const nameCell = cells.find(c => masterAccounts.some(a => c.includes(a.name)));
            if (nameCell) {
                const match = masterAccounts.find(a => nameCell.includes(a.name));
                const nums = line.replace(/,/g, '').match(/-?\d+/g) || [];
                if (nums.length >= 6) {
                    const len = nums.length;
                    const y = "2025", m = document.getElementById('monthSel').value;
                    dbData[`${y}-${m}-121-${match.name}`] = parseInt(nums[len-6]) || 0;
                    dbData[`${y}-${m}-122-${match.name}`] = parseInt(nums[len-4]) || 0;
                    dbData[`${y}-${m}-Total-${match.name}`] = parseInt(nums[len-2]) || 0;
                    count++;
                }
            }
        });
        alert(count + "件の科目を一括反映しました。");
        document.getElementById('pasteArea').value = "";
        calculate();
    }

    async function syncToFirebase() {
        const y = "2025", m = document.getElementById('monthSel').value;
        const filtered = {}; masterAccounts.forEach(a => filtered[a.name] = dbData[`${y}-${m}-${currentDept}-${a.name}`] || 0);
        try { await db.collection("accounting").doc(`${y}-${m}-${currentDept}`).set({ values: filtered, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }); alert("クラウド保存に成功しました！"); } 
        catch (e) { alert("保存失敗: " + e.message); }
    }

    function setDept(id, btn) {
        currentDept = id; document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active');
        document.getElementById('q-panel').style.display = (id === '122') ? 'block' : 'none'; calculate();
    }

    function calculate() {
        const y = "2025", m = document.getElementById('monthSel').value;
        let pq = 0, vq = 0, f = 0; const plBody = document.getElementById('pl-body'); plBody.innerHTML = '';
        masterAccounts.forEach(acc => {
            let val = dbData[`${y}-${m}-${currentDept}-${acc.name}`] || 0;
            if(acc.type === "売上") pq += val; else if(acc.type === "変動") vq += val; else f += val;
            const tag = acc.type === "売上" ? "tag-p" : (acc.type === "変動" ? "tag-v" : "tag-f");
            plBody.innerHTML += `<tr><td><span class="tag ${tag}">${acc.type}</span>${acc.name}</td><td style="text-align:right; font-weight:bold;">${val.toLocaleString()}</td></tr>`;
        });

        let q = (currentDept === '122') ? 0 : 1;
        if(currentDept === '122') document.querySelectorAll('.qin').forEach(i => q += parseInt(i.value) || 0);

        const mq = pq - vq, g = mq - f, p = pq / (q || 1), v = vq / (q || 1), m_ = p - v, ratio = pq > 0 ? (mq / pq) * 100 : 0, be = ratio > 0 ? Math.round(f / (ratio / 100)) : 0;

        document.getElementById('m-pq').innerText = pq.toLocaleString();
        document.getElementById('m-vq').innerText = vq.toLocaleString();
        document.getElementById('m-mq').innerText = mq.toLocaleString();
        document.getElementById('m-f').innerText = f.toLocaleString();
        document.getElementById('m-g').innerText = g.toLocaleString();
        document.getElementById('g-box').style.background = g >= 0 ? '#ecfdf5' : '#fef2f2';

        document.getElementById('v-p').innerText = Math.round(p).toLocaleString();
        document.getElementById('v-v').innerText = Math.round(v).toLocaleString();
        document.getElementById('v-m').innerText = Math.round(m_).toLocaleString();
        document.getElementById('v-q').innerText = q.toLocaleString();
        document.getElementById('v-mq').innerText = mq.toLocaleString();
        document.getElementById('id-ratio').innerText = ratio.toFixed(1) + "%";
        document.getElementById('id-be').innerText = "¥" + be.toLocaleString();

        updateCharts(pq, vq, f, g);
    }

    function updateCharts(pq, vq, f, g) {
        if(charts.st) charts.st.destroy();
        charts.st = new Chart(document.getElementById('stChart'), {
            type: 'bar',
            data: {
                labels: ['2022','2023','2024','今期'],
                datasets: [
                    { label: '利益(G)', data: [1187054, 631692, 1310425, g], backgroundColor: '#10b981' }, // 緑
                    { label: '固定費(F)', data: [540000, 600000, 540000, f], backgroundColor: '#94a3b8' }, // グレー
                    { label: '変動費(VQ)', data: [1102479, 1117585, 1355990, vq], backgroundColor: '#3b82f6' } // 青
                ]
            },
            options: { responsive: true, scales: { x: { stacked: true }, y: { stacked: true } }, plugins: { title: { display: true, text: '利益構造推移 (P=V+F+G)' } } }
        });
        if(charts.pr) charts.pr.destroy();
        charts.pr = new Chart(document.getElementById('prChart'), {
            type: 'line',
            data: { labels: ['2022','2023','2024','今期'], datasets: [{label:'利益トレンド',data:[1187054, 631692, 1310425, g],borderColor: '#10b981',tension:0.1}]},
            options: { responsive: true, plugins: { title: { display: true, text: '純利益推移' } } }
        });
    }
    calculate();
</script>

</body>
</html>
