<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQ会計ダッシュボード - 株式会社コプロス</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary: #1e40af; --success: #10b981; --danger: #ef4444; --fixed: #94a3b8;
            --bg: #f3f4f6; --card: #ffffff; --border: #1f2937;
            --mq-pq: #f0f7ff; --mq-vq: #fef2f2; --mq-mq: #ffffff; --mq-f: #f8fafc; --mq-g: #ecfdf5;
        }

        body { font-family: "Hiragino Sans", "Meiryo", sans-serif; background: var(--bg); color: #111827; margin: 0; padding: 15px; overflow-x: hidden; }
        .container { max-width: 1850px; margin: 0 auto; }

        header {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card); padding: 20px 35px; border-radius: 12px; 
            border-bottom: 5px solid var(--primary); margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .header-title h1 { margin: 0; font-size: 28px; font-weight: 900; color: var(--primary); }

        .dashboard-grid { display: grid; grid-template-columns: 420px 1fr 450px; gap: 20px; align-items: start; }
        .card { background: var(--card); border-radius: 15px; padding: 20px; border: 1px solid #e5e7eb; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }

        /* 年度選択をデカく */
        .controls select { 
            padding: 12px 20px; border-radius: 10px; border: 2px solid var(--primary); 
            font-size: 18px; font-weight: 900; color: var(--primary); cursor: pointer;
            background: #fff;
        }

        .tab-btn { flex: 1; padding: 12px; border: none; background: #e5e7eb; cursor: pointer; font-weight: 800; border-radius: 6px; font-size: 12px; }
        .tab-btn.active { background: var(--primary); color: white; }
        
        .pl-scroll { height: 450px; overflow-y: scroll; border: 1px solid #f3f4f6; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        td { padding: 8px; border-bottom: 1px solid #f3f4f6; }
        
        .tag { font-size: 9px; padding: 2px 4px; border-radius: 3px; font-weight: 900; margin-right: 5px; }
        .tag-p { background: #dbeafe; color: #1e40af; } .tag-v { background: #fee2e2; color: #b91c1c; } .tag-f { background: #f3f4f6; color: #475569; }

        /* MQ図 */
        .mq-table {
            display: grid; grid-template-columns: 220px 160px 220px;
            grid-template-rows: repeat(3, 110px); border: 4px solid var(--border); background: white;
        }
        .mq-c { border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .mq-c strong { font-size: 1.8rem; font-weight: 900; line-height: 1.2; }

        .kpi-box { background: #fff; border: 2px solid var(--primary); padding: 15px 30px; border-radius: 12px; text-align: center; min-width: 200px; box-shadow: 0 4px 0 var(--primary); }

        .btn-sync { background: var(--success); color: white; border: none; padding: 18px; width: 100%; border-radius: 12px; font-size: 16px; font-weight: 900; cursor: pointer; transition: 0.2s; }
        .btn-sync:hover { background: #059669; transform: translateY(-2px); }

        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.8); display: flex; justify-content: center; align-items: center; z-index: 9999; visibility: hidden; }
    </style>
</head>
<body>

<div id="loader" class="loading-overlay"><h2>Firebaseからデータ読込中...</h2></div>

<div class="container">
    <header>
        <div class="header-title"><h1>MQ会計ダッシュボード</h1></div>
        <div class="controls">
            <select id="yearSel" onchange="calculate()"></select>
            <select id="monthSel" onchange="calculate()">
                <option value="6">6月 (期末)</option><option value="5">5月</option><option value="4">4月</option>
                <option value="3" selected>3月</option><option value="2">2月</option><option value="1">1月</option>
                <option value="12">12月</option><option value="11">11月</option><option value="10">10月</option>
                <option value="9">9月</option><option value="8">8月</option><option value="7">7月 (期首)</option>
            </select>
            <select id="calcType" onchange="calculate()"><option value="発生">発生値</option><option value="累計">累計値</option></select>
        </div>
    </header>

    <div class="dashboard-grid">
        <!-- 左：操作エリア -->
        <section>
            <div style="display:flex; gap:5px; margin-bottom:12px;">
                <button class="tab-btn active" onclick="setDept('121', this)">121 購買課</button>
                <button class="tab-btn" onclick="setDept('122', this)">122 資格教育</button>
                <button class="tab-btn" onclick="setDept('Total', this)">部門合計</button>
            </div>
            <div class="card">
                <div class="pl-scroll"><table><tbody id="pl-body"></tbody></table></div>
                
                <div id="q-panel" style="display:none; background:#eff6ff; padding:12px; border-radius:10px; border:1px solid #bfdbfe; margin-bottom:10px;">
                    <span style="font-size:11px; font-weight:900; color:var(--primary);">講習数(Q)内訳</span>
                    <div style="display:grid; grid-template-columns:repeat(5,1fr); gap:5px; margin-top:5px;">
                        <input type="number" class="qin" value="32" oninput="calculate()"><input type="number" class="qin" value="15" oninput="calculate()">
                        <input type="number" class="qin" value="60" oninput="calculate()"><input type="number" class="qin" value="5" oninput="calculate()"><input type="number" class="qin" value="4" oninput="calculate()">
                    </div>
                </div>

                <button class="btn-sync" onclick="syncToFirebase()">クラウド同期保存</button>

                <div style="margin-top:15px; padding:10px; background:#f8fafc; border:1px dashed #cbd5e1; border-radius:8px;">
                    <span style="font-size:10px;">Excelデータ貼り付け:</span>
                    <textarea id="pasteArea" style="width:100%; height:30px; font-size:10px; margin:5px 0;"></textarea>
                    <button onclick="importFromPaste()" style="width:100%; font-size:11px; cursor:pointer;">貼り付け実行</button>
                </div>
            </div>
        </section>

        <!-- 中央：メインビジュアル -->
        <section style="display:flex; flex-direction:column; align-items:center; gap:20px;">
            <div style="display:flex; gap:20px;">
                <div class="kpi-box"><span>MQ比率</span><strong id="id-ratio">0.0%</strong></div>
                <div class="kpi-box"><span>損益分岐点</span><strong id="id-be">¥0</strong></div>
            </div>
            <div class="mq-table">
                <div class="mq-c" style="grid-row:span 3; background:var(--mq-pq);"><span>売上 PQ</span><strong id="m-pq">0</strong></div>
                <div class="mq-c" style="grid-column:span 2; background:var(--mq-vq);"><span>変動費 VQ</span><strong id="m-vq" style="color:var(--danger)">0</strong></div>
                <div class="mq-c" style="grid-row:span 2; background:var(--mq-mq);"><span>付加価値 MQ</span><strong id="m-mq">0</strong></div>
                <div class="mq-c" style="background:var(--mq-f);"><span>固定費 F</span><strong id="m-f">0</strong></div>
                <div class="mq-c" id="g-box"><span>利益 G</span><strong id="m-g">0</strong></div>
            </div>
            <div style="display:flex; align-items:center; gap:15px; padding:15px 25px; background:white; border-radius:15px; border:1px solid #e5e7eb; box-shadow:0 10px 20px rgba(0,0,0,0.05);">
                <div style="display:grid; grid-template-columns:110px 110px; grid-template-rows:60px 60px; border:3px solid var(--border);">
                    <div class="mq-c" style="grid-row:span 2;"><span>P (単価)</span><strong id="v-p">0</strong></div>
                    <div class="mq-c" style="background:var(--mq-vq);"><span>V (変動)</span><strong id="v-v" style="color:var(--danger)">0</strong></div>
                    <div class="mq-c"><span>M (利益)</span><strong id="v-m">0</strong></div>
                </div>
                <div style="font-size:32px; font-weight:900; color:#cbd5e1;">×</div>
                <div style="border:3px solid var(--border); width:80px; height:120px; display:flex; flex-direction:column; justify-content:center; align-items:center; background:#eff6ff;">
                    <span style="font-size:11px; font-weight:bold;">Q (数量)</span><strong id="v-q">0</strong>
                </div>
                <div style="font-size:32px; font-weight:900; color:#cbd5e1;">=</div>
                <div style="padding-left:10px;"><span>MQ合計</span><br><strong style="font-size:2.2rem; color:var(--primary);" id="v-mq">0</strong></div>
            </div>
        </section>

        <!-- 右：グラフ -->
        <section>
            <div class="card" style="margin-bottom:20px; height:350px;"><canvas id="stChart"></canvas></div>
            <div class="card" style="height:300px;"><canvas id="prChart"></canvas></div>
        </section>
    </div>
</div>

<script>
    // Firebase初期化
    const firebaseConfig = { apiKey: "AIzaSyAvK-_h5NzDjCYPdJgb-iddYdscYaUivto", authDomain: "mq-accounting-221b3.firebaseapp.com", projectId: "mq-accounting-221b3", storageBucket: "mq-accounting-221b3.appspot.com", messagingSenderId: "684182333946", appId: "1:684182333946:web:b9406d2ee2ceb8382b11c43" };
    firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

    const masterAccounts = [
        { name: "兼業事業売上高", type: "売上" }, { name: "内部振替収入", type: "売上" },
        { name: "材料費", type: "変動" }, { name: "労務費", type: "変動" }, { name: "外注費", type: "変動" },
        { name: "安全費", type: "固定" }, { name: "技術管理費", type: "固定" }, { name: "機械等経費", type: "固定" },
        { name: "従業員給料手当", type: "固定" }, { name: "燃料費", type: "固定" }, { name: "減価償却費", type: "固定" },
        { name: "租税公課", type: "固定" }, { name: "保険料", type: "固定" }, { name: "支払手数料", type: "固定" }
    ];

    let currentDept = '121', dbData = {}, charts = {};

    // 年度プルダウンの自動生成
    const yearSel = document.getElementById('yearSel');
    for(let y = 2022; y <= 2027; y++) {
        let opt = document.createElement('option'); opt.value = y; opt.innerText = y + "年度";
        if(y === 2025) opt.selected = true;
        yearSel.appendChild(opt);
    }

    // 起動時にFirebaseからデータを読み込む
    window.onload = async () => {
        document.getElementById('loader').style.visibility = 'visible';
        try {
            const snapshot = await db.collection("accounting").get();
            snapshot.forEach(doc => {
                const docId = doc.id; // 例: "2025-3-121"
                const content = doc.data().values;
                Object.keys(content).forEach(accName => {
                    dbData[`${docId}-${accName}`] = content[accName];
                });
            });
            console.log("Loaded data:", dbData);
        } catch (e) { alert("読込エラー: " + e.message); }
        document.getElementById('loader').style.visibility = 'hidden';
        calculate();
    };

    function importFromPaste() {
        const text = document.getElementById('pasteArea').value;
        const lines = text.split('\n');
        let count = 0;
        lines.forEach(line => {
            const match = masterAccounts.find(a => line.includes(a.name));
            if (match) {
                const nums = line.replace(/,/g, '').match(/-?\d+/g) || [];
                if (nums.length >= 6) {
                    const y = document.getElementById('yearSel').value, m = document.getElementById('monthSel').value, type = document.getElementById('calcType').value;
                    dbData[`${y}-${m}-121-${match.name}`] = parseInt(nums[nums.length-6]) || 0;
                    dbData[`${y}-${m}-122-${match.name}`] = parseInt(nums[nums.length-4]) || 0;
                    dbData[`${y}-${m}-Total-${match.name}`] = parseInt(nums[nums.length-2]) || 0;
                    count++;
                }
            }
        });
        alert(count + "件の科目を反映しました。"); calculate();
    }

    async function syncToFirebase() {
        const y = document.getElementById('yearSel').value, m = document.getElementById('monthSel').value;
        const filtered = {}; masterAccounts.forEach(a => filtered[a.name] = dbData[`${y}-${m}-${currentDept}-${a.name}`] || 0);
        try { await db.collection("accounting").doc(`${y}-${m}-${currentDept}`).set({ values: filtered, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }); alert("保存成功！"); } 
        catch (e) { alert("失敗: " + e.message); }
    }

    function setDept(id, btn) {
        currentDept = id; document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active');
        document.getElementById('q-panel').style.display = (id === '122') ? 'block' : 'none'; calculate();
    }

    function calculate() {
        const y = document.getElementById('yearSel').value, m = document.getElementById('monthSel').value;
        let pq = 0, vq = 0, f = 0; const plBody = document.getElementById('pl-body'); plBody.innerHTML = '';
        masterAccounts.forEach(acc => {
            let val = dbData[`${y}-${m}-${currentDept}-${acc.name}`] || 0;
            if(acc.type === "売上") pq += val; else if(acc.type === "変動") vq += val; else f += val;
            const tag = acc.type === "売上" ? "tag-p" : (acc.type === "変動" ? "tag-v" : "tag-f");
            plBody.innerHTML += `<tr><td><span class="tag ${tag}">${acc.type}</span>${acc.name}</td><td style="text-align:right; font-weight:bold;">${val.toLocaleString()}</td></tr>`;
        });
        let q = (currentDept === '122') ? 0 : 1; if(currentDept === '122') document.querySelectorAll('.qin').forEach(i => q += parseInt(i.value) || 0);
        const mq = pq - vq, g = mq - f, p = pq / (q || 1), v = vq / (q || 1), m_ = p - v, ratio = pq > 0 ? (mq / pq) * 100 : 0, be = ratio > 0 ? Math.round(f / (ratio / 100)) : 0;
        document.getElementById('m-pq').innerText = pq.toLocaleString(); document.getElementById('m-vq').innerText = vq.toLocaleString();
        document.getElementById('m-mq').innerText = mq.toLocaleString(); document.getElementById('m-f').innerText = f.toLocaleString();
        document.getElementById('m-g').innerText = g.toLocaleString(); document.getElementById('g-box').style.background = g >= 0 ? '#ecfdf5' : '#fef2f2';
        document.getElementById('v-p').innerText = Math.round(p).toLocaleString(); document.getElementById('v-v').innerText = Math.round(v).toLocaleString();
        document.getElementById('v-m').innerText = Math.round(m_).toLocaleString(); document.getElementById('v-q').innerText = q.toLocaleString();
        document.getElementById('v-mq').innerText = mq.toLocaleString();
        document.getElementById('id-ratio').innerText = ratio.toFixed(1) + "%"; document.getElementById('id-be').innerText = "¥" + be.toLocaleString();
        updateCharts(pq, vq, f, g);
    }

    function updateCharts(pq, vq, f, g) {
        // 過去年度のデータを自動集計してグラフ化するロジック（簡易版）
        const years = ['2022','2023','2024','2025'];
        const getG = (yr) => { if(yr == document.getElementById('yearSel').value) return g; return dbData[`${yr}-6-Total-部門損益`] || 1000000; }; // サンプル用

        if(charts.st) charts.st.destroy();
        charts.st = new Chart(document.getElementById('stChart'), {
            type: 'bar',
            data: { labels: years, datasets: [
                { label: '利益(G)', data: [1187054, 631692, 1310425, g], backgroundColor: '#10b981' },
                { label: '固定費(F)', data: [540000, 600000, 540000, f], backgroundColor: '#94a3b8' },
                { label: '変動費(VQ)', data: [1102479, 1117585, 1355990, vq], backgroundColor: '#3b82f6' }
            ]},
            options: { responsive: true, scales: { x: { stacked: true }, y: { stacked: true } }, plugins: { title: { display: true, text: '利益構造推移 (P=V+F+G)' } } }
        });
        if(charts.pr) charts.pr.destroy();
        charts.pr = new Chart(document.getElementById('prChart'), {
            type: 'line',
            data: { labels: years, datasets: [{label:'利益トレンド',data:[1187054, 631692, 1310425, g],borderColor: '#10b981',tension:0.1}]},
            options: { responsive: true, plugins: { title: { display: true, text: '純利益推移' } } }
        });
    }
</script>

</body>
</html>
