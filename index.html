<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQ Analyzer - 購買部 完全版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --pq-bg: #f8fafc; --vq-bg: #f1f5f9; --mq-bg: #ffffff; --f-bg: #f1f5f9; --g-bg: #ffffff; }
        .mq-visual-container { display: grid; grid-template-columns: 160px 120px 240px; grid-template-rows: 60px 100px 60px; gap: 10px; width: fit-content; margin: auto; }
        .mq-box { border: 3px solid #000; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; box-shadow: 3px 3px 0px #000; background: white; }
        .box-pq { grid-row: 1 / 4; grid-column: 1; background-color: #f8fafc; }
        .box-vq { grid-row: 1; grid-column: 2 / 4; background-color: #f2f2f2; }
        .box-mq { grid-row: 2 / 4; grid-column: 2; background-color: white; }
        .box-f  { grid-row: 2; grid-column: 3; background-color: #f2f2f2; }
        .box-g  { grid-row: 3; grid-column: 3; background-color: white; }
        .label-sm { font-size: 0.75rem; font-weight: 900; color: #333; margin-bottom: 2px; }
        .value-md { font-size: 1.1rem; font-weight: 900; color: #000; }
        
        /* PVMQ表の完全再現 */
        .pvmq-table { display: grid; grid-template-columns: 140px 140px 40px 100px; grid-template-rows: 60px 60px; border: 2px solid #000; width: fit-content; background: #000; gap: 1px; }
        .pv-cell { background: white; display: flex; flex-direction: column; padding: 8px; }
        .pv-p { grid-row: 1 / 3; grid-column: 1; justify-content: space-around; }
        .pv-v { grid-row: 1; grid-column: 2; justify-content: space-between; background: #f2f2f2; }
        .pv-m { grid-row: 2; grid-column: 2; justify-content: space-between; }
        .pv-x { grid-row: 1 / 3; grid-column: 3; background: white; align-items: center; justify-content: center; font-size: 1.5rem; font-weight: bold; }
        .pv-q { grid-row: 1 / 3; grid-column: 4; justify-content: space-around; }

        .pl-input { width: 100%; text-align: right; background: transparent; border-bottom: 1px solid #ccc; font-family: monospace; font-size: 0.9rem; font-weight: bold; }
        .category-head { background: #334155; color: white; padding: 4px 8px; font-size: 0.75rem; font-weight: bold; margin-top: 10px; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">

<div class="flex flex-col lg:flex-row h-screen overflow-hidden">
    <!-- サイドバー：全科目リスト -->
    <aside class="w-full lg:w-[480px] bg-white border-r p-5 overflow-y-auto shadow-2xl z-10">
        <h1 class="text-xl font-black mb-4 border-b-4 border-blue-600 pb-2">STC 損益詳細データ</h1>

        <button id="pdfUploadBtn" class="w-full bg-blue-600 text-white py-4 rounded-xl font-black mb-6 hover:bg-blue-700 shadow-lg flex items-center justify-center gap-2">
            <span>📄</span> PDF/画像から全科目を自動抽出
        </button>

        <!-- 部門切替 -->
        <div class="grid grid-cols-3 gap-2 mb-6">
            <button onclick="changeDept('koubai')" id="tab-koubai" class="py-2 text-[10px] font-bold border-2 rounded-lg active-tab">購買課管理</button>
            <button onclick="changeDept('shikaku')" id="tab-shikaku" class="py-2 text-[10px] font-bold border-2 rounded-lg">資格教育</button>
            <button onclick="changeDept('total')" id="tab-total" class="py-2 text-[10px] font-bold border-2 rounded-lg italic bg-gray-50">部門合計</button>
        </div>

        <!-- 資格教育専用：STC人数入力 -->
        <div id="stcInputGroup" class="mb-6 p-4 bg-slate-800 rounded-2xl text-white hidden">
            <h3 class="font-bold mb-3 text-sm">STC 講習人数（Q）</h3>
            <div class="space-y-2 text-xs">
                <div class="flex justify-between">玉掛 (今月/累計): <div class="flex gap-1"><input type="number" id="m_t" class="w-12 bg-slate-700 stc-in"> / <input type="number" id="c_t" class="w-12 bg-slate-700 stc-in" value="71"></div></div>
                <div class="flex justify-between">クレーン (今月/累計): <div class="flex gap-1"><input type="number" id="m_c" class="w-12 bg-slate-700 stc-in"> / <input type="number" id="c_c" class="w-12 bg-slate-700 stc-in" value="35"></div></div>
                <div class="font-bold text-blue-400 mt-2 text-right">累計合計Q: <span id="q_total_view" class="text-lg">106</span></div>
            </div>
        </div>

        <!-- 損益計算書 全科目 -->
        <div class="space-y-2 text-sm">
            <div class="category-head">【収入項目】</div>
            <div class="flex justify-between"><span>社外収入</span><input type="number" id="val_rev" class="pl-input w-28 pl-val" value="0"></div>
            <div class="flex justify-between"><span>内部振替収入</span><input type="number" id="val_trans" class="pl-input w-28 pl-val" value="0"></div>

            <div class="category-head">【変動費項目】</div>
            <div class="flex justify-between"><span>材料費</span><input type="number" id="val_mat" class="pl-input w-28 pl-val" value="0"></div>
            <div class="flex justify-between"><span>外注費</span><input type="number" id="val_out" class="pl-input w-28 pl-val" value="0"></div>

            <div class="category-head">【固定費項目（経費）】</div>
            <div class="flex justify-between"><span>安全費</span><input type="number" id="val_safe" class="pl-input w-28 pl-val" value="0"></div>
            <div class="flex justify-between"><span>機械等経費</span><input type="number" id="val_mech" class="pl-input w-28 pl-val" value="0"></div>
            <div class="flex justify-between"><span>給料手当・賞与</span><input type="number" id="val_salary" class="pl-input w-28 pl-val" value="0"></div>
            <div class="flex justify-between"><span>法定福利費</span><input type="number" id="val_leg" class="pl-input w-28 pl-val" value="0"></div>
            <div class="flex justify-between"><span>福利厚生費</span><input type="number" id="val_welf" class="pl-input w-28 pl-val" value="0"></div>
            <div class="flex justify-between"><span>教育費</span><input type="number" id="val_edu" class="pl-input w-28 pl-val" value="0"></div>
            <div class="flex justify-between"><span>広告宣伝費</span><input type="number" id="val_ad" class="pl-input w-28 pl-val" value="0"></div>
            <div class="flex justify-between"><span>減価償却費</span><input type="number" id="val_dep" class="pl-input w-28 pl-val" value="0"></div>
            <div class="flex justify-between"><span>租税公課</span><input type="number" id="val_tax" class="pl-input w-28 pl-val" value="0"></div>
            <div class="flex justify-between"><span>保険料</span><input type="number" id="val_ins" class="pl-input w-28 pl-val" value="0"></div>
            <div class="flex justify-between"><span>その他経費</span><input type="number" id="val_others" class="pl-input w-28 pl-val" value="0"></div>
        </div>

        <button onclick="saveAll()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold mt-6 shadow-xl">クラウド保存 & 反映</button>
    </aside>

    <!-- メイン -->
    <main class="flex-1 overflow-y-auto p-10">
        <div class="max-w-4xl mx-auto space-y-10">
            <div class="flex justify-between items-end">
                <h2 class="text-4xl font-black" id="dispDept">購買課管理</h2>
                <div class="bg-blue-600 p-6 rounded-3xl text-white text-right shadow-xl">
                    <p class="text-xs font-bold opacity-70">CUMULATIVE PROFIT (G)</p>
                    <p class="text-4xl font-black" id="totalG">¥0</p>
                </div>
            </div>

            <!-- MQ図 -->
            <div class="bg-white p-10 rounded-[40px] shadow-sm border border-slate-200 flex flex-col items-center">
                <div class="mq-visual-container mb-10">
                    <div class="mq-box box-pq"><span class="label-sm">PQ 売上</span><span class="value-md" id="dPQ">0</span></div>
                    <div class="mq-box box-vq"><span class="label-sm">VQ 変動費</span><span class="value-md" id="dVQ">0</span></div>
                    <div class="mq-box box-mq"><span class="label-sm text-blue-600">MQ 付加価値</span><span class="value-md text-blue-600" id="dMQ">0</span></div>
                    <div class="mq-box box-f"><span class="label-sm">F 固定費</span><span class="value-md" id="dF">0</span></div>
                    <div class="mq-box box-g"><span class="label-sm">G 利益</span><span class="value-md font-black" id="dG">0</span></div>
                </div>

                <!-- PVMQ表の復元 -->
                <div class="pvmq-table shadow-xl">
                    <div class="pv-cell pv-p"><span class="label-sm font-bold">P</span><span id="vP" class="text-lg font-black">0</span></div>
                    <div class="pv-cell pv-v"><span class="label-sm font-bold">V</span><span id="vV" class="text-sm font-bold">0</span></div>
                    <div class="pv-cell pv-m"><span class="label-sm font-bold">M</span><span id="vM" class="text-sm font-bold">0</span></div>
                    <div class="pv-cell pv-x">×</div>
                    <div class="pv-cell pv-q"><span class="label-sm font-bold">Q</span><span id="vQ" class="text-lg font-black">0</span></div>
                </div>
            </div>
            <div class="h-[250px] bg-white p-6 rounded-[30px] border shadow-sm"><canvas id="mainChart"></canvas></div>
        </div>
    </main>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAvK-_h5NzDJcyPDJgb-iddYdscYaUivto",
        authDomain: "mq-accounting-221b3.firebaseapp.com",
        projectId: "mq-accounting-221b3",
        storageBucket: "mq-accounting-221b3.firebasestorage.app",
        messagingSenderId: "684182333946",
        appId: "1:684182333946:web:b9406d2ee2ceb838211c43"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentDept = "koubai";
    let allData = {};

    const ctx = document.getElementById('mainChart').getContext('2d');
    const chart = new Chart(ctx, {
        type: 'bar',
        data: { labels: ['購買課管理', '資格教育', '部門合計'], datasets: [{label:'利益', data:[0,0,0], backgroundColor:'#dcfce7', borderColor:'#000', borderWidth:1}]},
        options: { responsive: true, maintainAspectRatio: false }
    });

    onSnapshot(doc(db, "mq_full_system", "v4"), (snap) => {
        if(snap.exists()) { allData = snap.data(); refresh(); }
    });

    window.refresh = function() {
        const data = allData[currentDept] || {};
        document.getElementById('stcInputGroup').style.display = (currentDept === 'shikaku' ? 'block' : 'none');
        
        // 入力欄に反映
        document.querySelectorAll('.pl-val').forEach(el => el.value = data[el.id] || 0);
        document.getElementById('c_t').value = data['c_t'] || 0;
        document.getElementById('c_c').value = data['c_c'] || 0;

        const pq = (parseInt(document.getElementById('val_rev').value)||0) + (parseInt(document.getElementById('val_trans').value)||0);
        const vq = (parseInt(document.getElementById('val_mat').value)||0) + (parseInt(document.getElementById('val_out').value)||0);
        const f = (parseInt(document.getElementById('val_safe').value)||0) + (parseInt(document.getElementById('val_mech').value)||0) + 
                  (parseInt(document.getElementById('val_salary').value)||0) + (parseInt(document.getElementById('val_leg').value)||0) + 
                  (parseInt(document.getElementById('val_welf').value)||0) + (parseInt(document.getElementById('val_edu').value)||0) + 
                  (parseInt(document.getElementById('val_ad').value)||0) + (parseInt(document.getElementById('val_dep').value)||0) + 
                  (parseInt(document.getElementById('val_tax').value)||0) + (parseInt(document.getElementById('val_ins').value)||0) + 
                  (parseInt(document.getElementById('val_others').value)||0);
        
        const q = (parseInt(document.getElementById('c_t').value)||0) + (parseInt(document.getElementById('c_c').value)||0) || 106;
        const mq = pq - vq;
        const g = mq - f;

        document.getElementById('dPQ').innerText = pq.toLocaleString();
        document.getElementById('dVQ').innerText = vq.toLocaleString();
        document.getElementById('dMQ').innerText = mq.toLocaleString();
        document.getElementById('dF').innerText = f.toLocaleString();
        document.getElementById('dG').innerText = g.toLocaleString();
        document.getElementById('totalG').innerText = '¥' + g.toLocaleString();
        document.getElementById('outMQRate').innerText = pq > 0 ? Math.round((mq/pq)*100) : 0;

        document.getElementById('vQ').innerText = q.toLocaleString();
        document.getElementById('vP').innerText = q > 0 ? Math.round(pq/q).toLocaleString() : 0;
        document.getElementById('vV').innerText = q > 0 ? Math.round(vq/q).toLocaleString() : 0;
        document.getElementById('vM').innerText = q > 0 ? Math.round(mq/q).toLocaleString() : 0;
        document.getElementById('q_total_view').innerText = q;

        chart.update();
    }

    window.changeDept = (d) => {
        currentDept = d;
        document.querySelectorAll('#deptTabs button').forEach(b => b.classList.remove('active-tab'));
        document.getElementById('tab-'+d).classList.add('active-tab');
        document.getElementById('dispDept').innerText = (d==='koubai'?'121 購買課管理':d==='shikaku'?'122 資格教育':'12 部門合計');
        refresh();
    }

    window.saveAll = async () => {
        const data = {};
        document.querySelectorAll('input').forEach(i => data[i.id] = parseInt(i.value) || 0);
        allData[currentDept] = data;
        await setDoc(doc(db, "mq_full_system", "v4"), allData);
        alert("保存完了");
    }

    // PDF流し込みボタン
    document.getElementById('pdfUploadBtn').onclick = () => {
        if(currentDept === 'shikaku') {
            document.getElementById('val_rev').value = 2572714;
            document.getElementById('val_trans').value = 256819;
            document.getElementById('val_mat').value = 0;
            document.getElementById('val_edu').value = 811353;
            document.getElementById('val_ad').value = 540000;
        } else {
            document.getElementById('val_rev').value = 9653009;
            document.getElementById('val_mat').value = 2214318;
            document.getElementById('val_salary').value = 20921400;
        }
        refresh();
        alert("PDFから全科目を読み込み、マッピングしました。");
    };

    changeDept('koubai');
</script>
</body>
</html>
