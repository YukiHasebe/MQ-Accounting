<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQ Accounting Dashboard - Copros</title>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --border: #334155; /* 濃いめの線でExcel風のハッキリした図解に */
            --text: #1e293b;
        }

        body {
            font-family: "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        /* ヘッダーエリア */
        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .header-title h1 { margin: 0; font-size: 24px; color: var(--primary); }
        .header-controls { display: flex; gap: 15px; align-items: center; }

        /* メインレイアウト（左にデータ、右に図解） */
        .dashboard-main {
            display: grid;
            grid-template-columns: 480px 1fr;
            gap: 30px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            border: 1px solid #e2e8f0;
        }

        /* タブ */
        .tabs { display: flex; gap: 4px; margin-bottom: 15px; }
        .tab-btn {
            padding: 10px 20px; border: none; background: #e2e8f0;
            cursor: pointer; font-weight: bold; border-radius: 4px;
        }
        .tab-btn.active { background: var(--primary); color: white; }

        /* MQ/PVMQ図解エリア */
        .visual-section { display: flex; flex-direction: column; gap: 30px; }

        /* MQ会計表ブロック */
        .mq-table-box {
            display: grid;
            grid-template-columns: 180px 120px 180px;
            grid-template-rows: repeat(3, 100px);
            gap: 0; /* 密着させてExcel図解風に */
            border: 2px solid var(--border);
            width: fit-content;
            background: white;
        }
        .mq-cell {
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            text-align: center;
        }
        .mq-cell span { font-size: 12px; font-weight: bold; margin-bottom: 5px; }
        .mq-cell strong { font-size: 1.4rem; }

        /* PVMQシミュレーター（画像再現） */
        .pvmq-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .pvm-block {
            display: grid;
            grid-template-columns: 120px 120px;
            grid-template-rows: 70px 70px;
            border: 2px solid var(--border);
        }
        .pvm-cell {
            border: 1px solid var(--border);
            padding: 5px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .cell-p { grid-row: span 2; }
        .symbol { font-size: 24px; font-weight: bold; }
        .q-block {
            border: 2px solid var(--border);
            width: 80px; height: 120px;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
        }

        /* テーブル */
        table { width: 100%; border-collapse: collapse; }
        th { background: #f1f5f9; padding: 10px; text-align: left; font-size: 12px; }
        td { padding: 8px; border-bottom: 1px solid #e2e8f0; }
        input[type="number"] {
            width: 100%; border: 1px solid #cbd5e1; padding: 5px; border-radius: 4px; text-align: right;
        }

        .btn-sync {
            background: #059669; color: white; border: none; padding: 12px;
            border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-title">
            <h1>MQ会計ダッシュボード <span style="font-size: 14px; color: #64748b;">Copros Management System</span></h1>
        </div>
        <div class="header-controls">
            <label>対象年度:</label>
            <select id="yearSelect"><option>2025年度</option></select>
            <label>対象月:</label>
            <select id="monthSelect" onchange="calculate()">
                <option value="6">2025年06月(発生)</option>
                <option value="all">2024年07月〜2025年06月(累計)</option>
            </select>
            <button onclick="document.getElementById('csvFile').click()" style="padding:5px 10px; cursor:pointer;">CSVインポート</button>
            <input type="file" id="csvFile" style="display:none">
        </div>
    </header>

    <div class="dashboard-main">
        <!-- 左側：詳細データ入力 -->
        <section>
            <div class="tabs">
                <button class="tab-btn active" onclick="setDept('dept1', this)">121 購買課管理</button>
                <button class="tab-btn" onclick="setDept('dept2', this)">122 資格教育</button>
                <button class="tab-btn" onclick="setDept('deptTotal', this)">部門合計</button>
            </div>
            
            <div class="card">
                <h3 id="dept-title" style="margin-top:0;">121 購買課管理</h3>
                <div id="q-input-area" style="background:#eff6ff; padding:10px; border-radius:6px; margin-bottom:15px; display:none;">
                    <label style="font-weight:bold; color:#2563eb;">講習数(Q): </label>
                    <input type="number" id="input-q" value="106" style="width:80px;" oninput="calculate()">
                </div>
                <table>
                    <thead>
                        <tr><th>勘定科目</th><th style="text-align:right">金額 (¥)</th></tr>
                    </thead>
                    <tbody id="pl-body">
                        <!-- JSで挿入 -->
                    </tbody>
                </table>
                <button class="btn-sync" onclick="alert('Firebaseに保存しました')">クラウド同期保存</button>
            </div>
        </section>

        <!-- 右側：MQ図解・PVMQ図解 -->
        <section class="visual-section">
            <!-- 1. MQ図 -->
            <div class="card">
                <h4 style="margin-top:0;">MQ会計表 (累計/発生)</h4>
                <div class="mq-table-box">
                    <div class="mq-cell" style="grid-row: span 3; background:#f0f7ff;"><span>売上 PQ</span><strong id="m-pq">0</strong></div>
                    <div class="mq-cell" style="grid-column: span 2; background:#fff1f2;"><span>変動費 VQ</span><strong id="m-vq" style="color:#e11d48">0</strong></div>
                    <div class="mq-cell" style="grid-row: span 2; background:#ffffff;"><span>付加価値 MQ</span><strong id="m-mq">0</strong></div>
                    <div class="mq-cell" style="background:#f8fafc;"><span>固定費 F</span><strong id="m-f">0</strong></div>
                    <div class="mq-cell" id="g-bg"><span>利益 G</span><strong id="m-g">0</strong></div>
                </div>
            </div>

            <!-- 2. PVMQ図（画像再現） -->
            <div class="card">
                <h4 style="margin-top:0;">PVMQシミュレーション</h4>
                <div class="pvmq-container">
                    <div class="pvm-block">
                        <div class="pvm-cell cell-p"><span>P</span><strong id="v-p">0</strong></div>
                        <div class="pvm-cell" style="background:#fff1f2;"><span>V</span><strong id="v-v">0</strong></div>
                        <div class="pvm-cell"><span>M</span><strong id="v-m">0</strong></div>
                    </div>
                    <div class="symbol">×</div>
                    <div class="q-block" style="background:#eff6ff;">
                        <span>Q</span><strong id="v-q">0</strong>
                    </div>
                    <div class="symbol">=</div>
                    <div style="text-align:center;">
                        <span style="font-size:12px; color:#64748b;">MQ (付加価値)</span><br>
                        <strong style="font-size:1.8rem;" id="v-mq">0</strong>
                    </div>
                </div>
            </div>

            <!-- 分析指標 -->
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                <div class="card" style="text-align:center;">
                    <span style="font-size:12px; color:#64748b;">MQ比率</span><br>
                    <strong style="font-size:1.5rem;" id="idx-ratio">0%</strong>
                </div>
                <div class="card" style="text-align:center;">
                    <span style="font-size:12px; color:#64748b;">損益分岐点売上</span><br>
                    <strong style="font-size:1.5rem;" id="idx-be">¥0</strong>
                </div>
            </div>
        </section>
    </div>
</div>

<script>
    let currentDeptId = 'dept1';
    const deptData = {
        dept1: { title: "121 購買課管理", q: 1, p: 14592006, v: 550269, f: 24504444 },
        dept2: { title: "122 資格教育", q: 106, p: 26694, v: 10401, f: 540000 },
        deptTotal: { title: "部門合計", q: 1, p: 17287415, v: 550269, f: 25044444 }
    };

    function setDept(id, btn) {
        currentDeptId = id;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('dept-title').innerText = deptData[id].title;
        document.getElementById('q-input-area').style.display = (id === 'dept2') ? 'block' : 'none';
        renderTable();
        calculate();
    }

    function renderTable() {
        const d = deptData[currentDeptId];
        const rows = [
            { id:'pq', name: "完成工事高 (PQ)", val: Math.round(d.p * d.q) },
            { id:'vq', name: "変動費 (VQ)", val: Math.round(d.v * d.q) },
            { id:'f',  name: "固定費 (F)", val: d.f }
        ];
        let html = '';
        rows.forEach(r => {
            html += `<tr><td>${r.name}</td><td><input type="number" id="in-${r.id}" value="${r.val}" onchange="updateFromTable()"></td></tr>`;
        });
        document.getElementById('pl-body').innerHTML = html;
    }

    function updateFromTable() {
        const q = (currentDeptId === 'dept2') ? parseFloat(document.getElementById('input-q').value) : 1;
        deptData[currentDeptId].p = document.getElementById('in-pq').value / q;
        deptData[currentDeptId].v = document.getElementById('in-vq').value / q;
        deptData[currentDeptId].f = parseFloat(document.getElementById('in-f').value);
        calculate();
    }

    function calculate() {
        const d = deptData[currentDeptId];
        const q = (currentDeptId === 'dept2') ? parseFloat(document.getElementById('input-q').value) : d.q;
        
        const pq = Math.round(d.p * q);
        const vq = Math.round(d.v * q);
        const mq = pq - vq;
        const f = d.f;
        const g = mq - f;
        
        const m = d.p - d.v;
        const ratio = pq > 0 ? (mq / pq) * 100 : 0;
        const be = ratio > 0 ? Math.round(f / (ratio / 100)) : 0;

        // MQ図
        document.getElementById('m-pq').innerText = pq.toLocaleString();
        document.getElementById('m-vq').innerText = vq.toLocaleString();
        document.getElementById('m-mq').innerText = mq.toLocaleString();
        document.getElementById('m-f').innerText = f.toLocaleString();
        document.getElementById('m-g').innerText = g.toLocaleString();
        document.getElementById('g-bg').style.background = g >= 0 ? '#f0fdf4' : '#fff1f2';

        // PVMQ図
        document.getElementById('v-p').innerText = Math.round(d.p).toLocaleString();
        document.getElementById('v-v').innerText = Math.round(d.v).toLocaleString();
        document.getElementById('v-m').innerText = Math.round(m).toLocaleString();
        document.getElementById('v-q').innerText = q.toLocaleString();
        document.getElementById('v-mq').innerText = mq.toLocaleString();

        document.getElementById('idx-ratio').innerText = ratio.toFixed(1) + "%";
        document.getElementById('idx-be').innerText = "¥" + be.toLocaleString();
    }

    setDept('dept1', document.querySelector('.tab-btn'));
</script>

</body>
</html>
