<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQ会計 ストラック表 - 株式会社コプロス 究極版</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --primary: #1e40af; --success: #3b82f6; --danger: #ef4444; --gray: #94a3b8;
            --bg: #f1f5f9; --card: #ffffff; --border: #1e293b;
            --mq-pq: #eff6ff; --mq-vq: #fef2f2; --mq-f: #f1f5f9; --mq-g: #ecfdf5;
            --edit-bg: #fffbeb; /* 編集モード時の背景色 */
        }
        body { font-family: "Hiragino Sans", "Meiryo", sans-serif; background: var(--bg); color: #1e293b; margin: 0; padding: 10px; overflow-x: hidden; }
        .container { max-width: 1880px; margin: 0 auto; padding-bottom: 140px; }

        header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 30px; border-radius: 12px; border-bottom: 5px solid var(--primary); margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .header-title h1 { margin: 0; font-size: 24px; font-weight: 900; color: var(--primary); letter-spacing: 2px; }
        .controls select { padding: 10px 15px; border-radius: 8px; border: 2px solid var(--primary); font-size: 16px; font-weight: 900; color: var(--primary); cursor: pointer; background: #fff; }

        .dashboard-grid { display: grid; grid-template-columns: 430px 1fr 450px; gap: 20px; align-items: start; }
        .card { background: white; border-radius: 15px; padding: 20px; border: 1px solid #e2e8f0; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: background 0.3s; }
        /* 編集モード時のカードスタイル */
        .card.edit-active { background: var(--edit-bg); border: 2px solid #f59e0b; }

        .tab-btn { flex: 1; padding: 12px; border: none; background: #e5e7eb; cursor: pointer; font-weight: 800; border-radius: 8px; font-size: 12px; }
        .tab-btn.active { background: var(--primary); color: white; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        td { padding: 5px 8px; border-bottom: 1px solid #f1f5f9; position: relative; }
        .tag { font-size: 8px; padding: 1px 4px; border-radius: 3px; font-weight: 900; margin-right: 4px; display: inline-block; width: 30px; text-align: center; }
        .tag-p { background: #dbeafe; color: #1e40af; } .tag-v { background: #fee2e2; color: #b91c1c; } .tag-f { background: #f3f4f6; color: #475569; }

        .summary-row { display: flex; gap: 15px; width: 100%; margin-bottom: 15px; justify-content: center; }
        .summary-box { background: white; border: 1px solid #cbd5e1; padding: 10px 20px; border-radius: 12px; text-align: center; flex: 1; }
        /* 赤字アラート */
        .summary-box.alert { border: 2px solid var(--danger); background: #fff1f2; }
        .summary-box span { font-size: 10px; font-weight: bold; color: var(--gray); display: block; }
        .summary-box strong { font-size: 1.6rem; font-weight: 900; color: #1e293b; }

        .kpi-row { display: flex; gap: 20px; margin-bottom: 15px; width: 100%; justify-content: center; }
        .kpi-box { background: white; border: 3px solid var(--primary); padding: 10px; border-radius: 12px; text-align: center; flex: 1; max-width: 250px; display: flex; flex-direction: column; justify-content: center; box-shadow: 0 4px 0 var(--primary); }
        .kpi-box strong { font-size: 2.1rem; color: var(--primary); line-height: 1.1; }

        .mq-table { display: grid; grid-template-columns: 240px 140px 240px; grid-template-rows: repeat(3, 110px); border: 4px solid var(--border); background: white; }
        .mq-c { border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 10px; }
        .mq-c strong { font-size: 1.6rem; font-weight: 900; }

        .pvmq-sim-area { display: flex; align-items: center; gap: 15px; padding: 15px 25px; background: white; border-radius: 15px; border: 1px solid #cbd5e1; margin-top: 20px; }
        .pvm-grid-box { display: grid; grid-template-columns: 160px 160px; grid-template-rows: 75px 75px; border: 3px solid var(--border); }
        .pvm-c { border: 1px solid var(--border); display: flex; flex-direction: column; justify-content: center; align-items: center; background: white; padding: 5px; }
        .pvm-p { grid-row: span 2; }
        .pvm-v { background: var(--mq-vq) !important; }
        .q-box-large { border: 3px solid var(--border); width: 100px; height: 150px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #eff6ff; }

        /* 戦略カード */
        .sens-grid { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .sens-card { background: #1e293b; color: white; padding: 15px; border-radius: 12px; border-left: 5px solid #10b981; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .sens-label { font-size: 10px; color: #94a3b8; display: block; margin-bottom: 5px; font-weight: bold; }
        .sens-result { font-size: 1.2rem; font-weight: 900; color: #10b981; }

        /* 目標逆算（追加アイデア） */
        .goal-seek-area { background: #fdf2f2; border: 2px dashed var(--danger); padding: 10px; border-radius: 8px; margin-top: 10px; font-size: 11px; }

        .drawer { position: fixed; right: -820px; background: white; border: 3px solid var(--primary); padding: 25px; border-radius: 15px 0 0 15px; transition: 0.5s; z-index: 2000; box-shadow: -10px 0 30px rgba(0,0,0,0.2); }
        .drawer.open { right: 0 !important; }
        .drawer-handle { position: absolute; left: -45px; width: 45px; height: 110px; background: var(--primary); color: white; display: flex; align-items: center; justify-content: center; writing-mode: vertical-rl; cursor: pointer; border-radius: 12px 0 0 12px; font-size: 12px; font-weight: 900; }

        .footer-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #1e293b; color: white; display: flex; justify-content: space-around; padding: 15px 0; z-index: 500; border-top: 4px solid var(--success); }
        .footer-item { text-align: center; flex: 1; }
        .footer-item strong { font-size: 1.6rem; color: #60a5fa; display: block; }
        .footer-item span { font-size: 10px; color: white; font-weight: bold; }

        .btn-sync { background: var(--primary); color: white; border: none; padding: 18px; width: 100%; border-radius: 12px; font-size: 18px; font-weight: 900; cursor: pointer; box-shadow: 0 4px 0 #172554; }
        input.cell-edit { width: 100%; border: none; text-align: right; font-weight: bold; font-size: 11px; background: transparent; padding: 2px; }
        input.cell-edit:focus { background: white; outline: 1px solid var(--primary); }
    </style>
</head>
<body>

<div class="drawer" id="paste-drawer">
    <div class="drawer-handle" onclick="toggleDrawer('paste-drawer')">EXCEL貼り付け</div>
    <textarea id="pasteArea" style="width:100%; height:200px; border:1px solid #cbd5e1; margin-top:10px; font-size:11px;" placeholder="Excelの範囲をペースト"></textarea>
    <button onclick="importFromPaste()" style="width:100%; background:var(--primary); color:white; border:none; padding:15px; margin-top:10px; border-radius:8px; font-weight:bold; cursor:pointer;">反映を実行</button>
</div>

<div class="container">
    <header>
        <div class="header-title"><h1>MQ会計　ストラック表</h1></div>
        <div class="controls">
            <button onclick="window.print()" style="background:var(--primary); color:white; padding:10px 20px; border:none; border-radius:8px; font-weight:bold; cursor:pointer; margin-right:15px;">PDFレポート出力</button>
            <select id="yearSel" onchange="calculate()"><option value="2025" selected>2025年度</option><option value="2024">2024年度</option></select>
            <select id="monthSel" onchange="calculate()" style="margin-left:10px;">
                <option value="3" selected>3月</option><option value="4">4月</option><option value="5">5月</option>
            </select>
            <select id="calcType" onchange="calculate()" style="margin-left:10px;"><option value="発生">発生値</option><option value="累計">累計値</option></select>
        </div>
    </header>

    <div class="dashboard-grid">
        <section>
            <div style="display:flex; gap:4px; margin-bottom:12px;">
                <button class="tab-btn active" id="btn-121" onclick="setDept('121', this)">121 購買課</button>
                <button class="tab-btn" id="btn-122" onclick="setDept('122', this)">122 資格教育</button>
                <button class="tab-btn" id="btn-Total" onclick="setDept('Total', this)">部門合計</button>
            </div>
            <div class="card" id="input-card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                    <span style="font-size:12px; font-weight:bold;">勘定科目内訳 (全表示)</span>
                    <button onclick="toggleEditMode()" style="font-size:10px; cursor:pointer; border-radius:4px; border:1px solid #ddd; padding:2px 8px;">編集モード切替</button>
                </div>
                <div style="max-height: 550px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 8px;">
                    <table><tbody id="pl-body"></tbody></table>
                </div>
                
                <div id="q-manual" style="margin-top:10px; padding:12px; background:#f8fafc; border-radius:10px; border:1px solid #e2e8f0;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <label style="font-size:11px; font-weight:bold;">活動数(Q)入力</label>
                        <input type="number" id="q-val-manual" value="1" oninput="calculateOnly()" style="width:100px; text-align:right; font-weight:bold; border:1px solid #cbd5e1; border-radius:4px;">
                    </div>
                </div>

                <!-- アイデア：目標逆算 -->
                <div class="goal-seek-area">
                    <strong>目標利益へのQ逆算</strong><br>
                    利益をあと <input type="number" id="target-plus" value="1000000" oninput="calculateOnly()" style="width:80px; font-size:10px;"> 円増やすには<br>
                    あと <span id="need-q" style="font-size:14px; color:var(--danger); font-weight:900;">0</span> 人の客が必要です。
                </div>

                <button class="btn-sync" onclick="syncToFirebase()" style="margin-top:15px;">クラウド同期保存</button>
            </div>
        </section>

        <section style="display:flex; flex-direction:column; align-items:center;">
            <div class="summary-row">
                <div class="summary-box"><span>売上 PQ</span><strong id="card-pq">¥0</strong></div>
                <div class="summary-box"><span>支出合計 (VQ+F)</span><strong id="card-exp" style="color:var(--danger)">¥0</strong></div>
                <div class="summary-box" id="summary-g-box"><span>部門損益 G</span><strong id="card-g">¥0</strong></div>
            </div>
            
            <div class="mq-table">
                <div class="mq-c" style="grid-row:span 3; background:var(--mq-pq);"><span>売上 PQ</span><strong id="m-pq">0</strong></div>
                <div class="mq-c" style="grid-column:span 2; background:var(--mq-vq);"><span>変動費 VQ</span><strong id="m-vq" style="color:var(--danger)">0</strong></div>
                <div class="mq-c" style="grid-row:span 2; background:var(--mq-mq);"><span>付加価値 MQ</span><strong id="m-mq">0</strong></div>
                <div class="mq-c" style="background:var(--mq-f);"><span>固定費 F</span><strong id="m-f">0</strong></div>
                <div class="mq-c" id="g-box"><span>利益 G</span><strong id="m-g">0</strong></div>
            </div>

            <div class="pvmq-sim-area">
                <div class="pvm-grid-box">
                    <div class="pvm-c pvm-p"><span>P (単価)</span><strong id="v-p">0</strong></div>
                    <div class="pvm-c pvm-v"><span>V (変動)</span><strong id="v-v" style="color:var(--danger)">0</strong></div>
                    <div class="pvm-c"><span>M (利益)</span><strong id="v-m">0</strong></div>
                </div>
                <div style="font-size:35px; font-weight:900; color:#cbd5e1;">×</div>
                <div class="q-box-large"><span>Q (数量)</span><strong id="v-q">0</strong></div>
                <div style="font-size:35px; font-weight:900; color:#cbd5e1;">=</div>
                <div style="padding-left:15px;"><span>MQ合計</span><br><strong style="font-size:2.4rem; color:var(--primary);" id="v-mq">0</strong></div>
            </div>

            <div class="sens-grid">
                <div class="sens-card"><span class="sens-label">単価(P) 5%アップなら</span><strong class="sens-result" id="sens-p">¥0 UP</strong></div>
                <div class="sens-card"><span class="sens-label">数量(Q) 5%アップなら</span><strong class="sens-result" id="sens-q">¥0 UP</strong></div>
                <div class="sens-card"><span class="sens-label">変動費(V) 5%ダウンなら</span><strong class="sens-result" id="sens-v">¥0 UP</strong></div>
                <div class="sens-card" style="border-left:4px solid var(--success);"><span class="sens-label">固定費(F) 5%ダウンなら</span><strong class="sens-result" id="sens-f">¥0 UP</strong></div>
            </div>
        </section>

        <section id="chart-area">
            <div class="card" style="height:400px; margin-bottom:20px;"><canvas id="stChart"></canvas></div>
            <div class="card" style="height:350px;"><canvas id="chart2"></canvas></div>
        </section>
    </div>

    <div class="footer-bar">
        <div class="footer-item"><strong id="id-ratio">0.0%</strong><span>MQ比率</span></div>
        <div class="footer-item"><strong id="id-be">¥0</strong><span>損益分岐点売上</span></div>
        <div class="footer-item"><strong id="idx-safety">0.0%</strong><span>安全余裕率</span></div>
    </div>
</div>

<script>
    const firebaseConfig = { 
        apiKey: "AIzaSyAvK-_h5NZdJcyPDJgb-iddYdscYaUivto", 
        authDomain: "mq-accounting-221b3.firebaseapp.com", 
        projectId: "mq-accounting-221b3", 
        storageBucket: "mq-accounting-221b3.appspot.com", 
        messagingSenderId: "684182333946", 
        appId: "1:684182333946:web:b9406d2ee2ceb8382b11c43" 
    };
    firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

    const masterAccounts = [
        { name: "社外収入", type: "売上" }, { name: "内部振替収入", type: "売上" },
        { name: "材料費", type: "変動" }, { name: "労務費", type: "変動" }, { name: "運搬費", type: "変動" },
        { name: "安全費", type: "変動" }, { name: "技術管理費", type: "変動" }, { name: "機械等経費", type: "変動" },
        { name: "従業員給料手当", type: "固定" }, { name: "従業員賞与", type: "固定" }, { name: "法定福利費", type: "固定" },
        { name: "福利厚生費", type: "固定" }, { name: "修繕維持費", type: "変動" }, { name: "事務用品費", type: "変動" },
        { name: "消耗品費", type: "変動" }, { name: "諸会費", type: "変動" }, { name: "教育費", type: "変動" },
        { name: "広告宣伝費", type: "固定" }, { name: "通信交通費", type: "変動" }, { name: "燃料費", type: "変動" },
        { name: "動力用水光熱費", type: "変動" }, { name: "減価償却費", type: "固定" }, { name: "租税公課", type: "変動" },
        { name: "保険料", type: "変動" }, { name: "車両費", type: "変動" }, { name: "支払い手数料", type: "変動" },
        { name: "補償費", type: "変動" }, { name: "雑費", type: "変動" }, { name: "内部調達原価", type: "変動" },
        { name: "**支出合計**", type: "集計" }, { name: "**部門損益**", type: "集計" }
    ];

    let currentDept = '121', dbData = {}, charts = {}, editMode = false;
    Chart.register(ChartDataLabels);

    window.onload = () => {
        db.collection("accounting").get().then(snap => { 
            snap.forEach(doc => dbData[doc.id] = doc.data().values); 
            calculate(); 
        });
    };

    function toggleDrawer(id) { document.getElementById(id).classList.toggle('open'); }
    function toggleEditMode() { 
        editMode = !editMode; 
        document.getElementById('input-card').classList.toggle('edit-active', editMode);
        calculate(); 
    }

    function handleInputKey(e, input) {
        if (e.key === 'Enter') {
            const rows = Array.from(document.querySelectorAll('.cell-edit'));
            const idx = rows.indexOf(input);
            if (idx > -1 && rows[idx+1]) rows[idx+1].focus();
            input.blur();
        }
    }

    function calculate(skipTableRender = false) {
        const y = document.getElementById('yearSel').value, m = document.getElementById('monthSel').value, type = document.getElementById('calcType').value;
        const key = `${y}-${m}-${currentDept}`;
        if(!dbData[key]) dbData[key] = {};
        const data = dbData[key];

        let pq = 0, vq = 0, f = 0;
        masterAccounts.forEach(acc => {
            if(acc.type === "集計") return;
            let val = data[acc.name + "-" + type] || 0;
            if(acc.type === "売上") pq += val;
            else if(acc.type === "固定") f += val;
            else vq += val;
        });
        
        const totalExp = vq + f, profitG = pq - totalExp;
        data[`**支出合計**-${type}`] = totalExp;
        data[`**部門損益**-${type}`] = profitG;

        if (!skipTableRender) {
            const plBody = document.querySelector('#pl-body');
            plBody.innerHTML = '';
            masterAccounts.forEach(acc => {
                let val = data[acc.name + "-" + type] || 0;
                const isTotal = acc.type === "集計";
                const tag = (acc.type === "売上") ? "tag-p" : (acc.type === "固定" ? "tag-f" : "tag-v");
                plBody.innerHTML += `
                    <tr style="${isTotal?'background:#f8fafc; font-weight:900;':''}">
                        <td><span class="tag ${tag}">${acc.type[0]}</span>${acc.name}</td>
                        <td style="text-align:right;">
                            <input type="text" class="cell-edit" value="${val.toLocaleString()}" ${isTotal?'readonly':''}
                                onfocus="this.value=this.value.replace(/,/g,'')" 
                                onblur="updateValue('${acc.name}', '${type}', this.value)"
                                onkeydown="handleInputKey(event, this)">
                        </td>
                    </tr>`;
            });
        }

        let q = parseInt(document.getElementById('q-val-manual').value) || 1;
        const mq = pq-vq, p = pq/q, v = vq/q, m_ = p-v, ratio = pq>0?(mq/pq)*100:0, be = ratio>0?Math.round(f/(ratio/100)):0;
        
        // 逆算
        const tPlus = parseInt(document.getElementById('target-plus').value) || 0;
        document.getElementById('need-q').innerText = m_ > 0 ? Math.ceil(tPlus / m_).toLocaleString() : "0";

        // 反映
        document.getElementById('card-pq').innerText = "¥" + pq.toLocaleString();
        document.getElementById('card-exp').innerText = "¥" + totalExp.toLocaleString();
        document.getElementById('card-g').innerText = "¥" + profitG.toLocaleString();
        document.getElementById('summary-g-box').className = profitG < 0 ? 'summary-box alert' : 'summary-box';
        
        document.getElementById('m-pq').innerText = pq.toLocaleString();
        document.getElementById('m-vq').innerText = vq.toLocaleString();
        document.getElementById('m-mq').innerText = mq.toLocaleString();
        document.getElementById('m-f').innerText = f.toLocaleString();
        document.getElementById('m-g').innerText = profitG.toLocaleString();
        document.getElementById('g-box').style.background = profitG>=0?'var(--mq-g)':'var(--mq-vq)';
        
        document.getElementById('v-p').innerText = Math.round(p).toLocaleString();
        document.getElementById('v-v').innerText = Math.round(v).toLocaleString();
        document.getElementById('v-m').innerText = Math.round(m_).toLocaleString();
        document.getElementById('v-q').innerText = q.toLocaleString();
        document.getElementById('v-mq').innerText = mq.toLocaleString();

        document.getElementById('id-ratio').innerText = ratio.toFixed(1) + "%";
        document.getElementById('id-be').innerText = "¥" + be.toLocaleString();
        document.getElementById('idx-safety').innerText = pq>0 ? (((pq-be)/pq)*100).toFixed(1)+"%" : "0.0%";

        // 戦略シミュ
        document.getElementById('sens-p').innerText = "¥" + Math.round(pq * 0.05).toLocaleString() + " UP";
        document.getElementById('sens-q').innerText = "¥" + Math.round(mq * 0.05).toLocaleString() + " UP";
        document.getElementById('sens-v').innerText = "¥" + Math.round(vq * 0.05).toLocaleString() + " UP";
        document.getElementById('sens-f').innerText = "¥" + Math.round(f * 0.05).toLocaleString() + " UP";

        updateCharts(pq, vq, f, profitG);
    }

    function updateValue(name, type, val) {
        const key = `${document.getElementById('yearSel').value}-${document.getElementById('monthSel').value}-${currentDept}`;
        dbData[key][name+"-"+type] = parseInt(val.replace(/,/g,'')) || 0;
        calculate(false);
    }

    async function syncToFirebase() {
        const key = `${document.getElementById('yearSel').value}-${document.getElementById('monthSel').value}-${currentDept}`;
        await db.collection("accounting").doc(key).set({ values: dbData[key], updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        alert("保存完了！");
    }

    function setDept(id, btn) {
        currentDept = id; document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active');
        calculate();
    }

    function updateCharts(pq, vq, f, g) {
        if(charts.st) charts.st.destroy();
        charts.st = new Chart(document.getElementById('stChart'), { 
            type: 'bar', 
            data: { 
                labels: ['実績'], 
                datasets: [
                    { label: '利益(G)', data: [g], backgroundColor: '#10b981' }, 
                    { label: '固定費(F)', data: [f], backgroundColor: '#94a3b8' }, 
                    { label: '変動費(VQ)', data: [vq], backgroundColor: '#3b82f6' }
                ]
            }, 
            options: { plugins: { datalabels: { formatter: v => v.toLocaleString() } }, scales: { x: { stacked: true }, y: { stacked: true } }, maintainAspectRatio: false } 
        });
    }
</script>
</body>
</html>
