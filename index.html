<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQ Analyzer - 購買部 決算ダッシュボード</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --pq-bg: #f0f7ff; --vq-bg: #fef2f2; --mq-bg: #eff6ff; --f-bg: #fffbeb; --g-bg: #f0fdf4; --border-color: #1e293b; }
        .mq-visual-container { display: grid; grid-template-columns: 200px 140px 300px; grid-template-rows: 80px 140px 80px; gap: 15px; width: fit-content; margin: auto; }
        .mq-box { border: 4px solid var(--border-color); border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; box-shadow: 0 8px 15px -1px rgb(0 0 0 / 0.1); background: white; }
        .box-pq { grid-row: 1 / 4; grid-column: 1; background-color: var(--pq-bg); }
        .box-vq { grid-row: 1; grid-column: 2 / 4; background-color: var(--vq-bg); }
        .box-mq { grid-row: 2 / 4; grid-column: 2; background-color: var(--mq-bg); }
        .box-f  { grid-row: 2; grid-column: 3; background-color: var(--f-bg); }
        .box-g  { grid-row: 3; grid-column: 3; background-color: var(--g-bg); }
        .label { font-size: 1.1rem; font-weight: 900; color: #475569; margin-bottom: 5px; }
        .value { font-size: 1.8rem; font-weight: 900; color: #0f172a; }
        .active-tab { background-color: #1e40af !important; color: white !important; }
        .stc-table input { width: 60px; text-align: center; border: 1px solid #cbd5e1; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen font-sans">

<div class="flex flex-col lg:flex-row h-screen overflow-hidden">
    <!-- サイドバー -->
    <aside class="w-full lg:w-[480px] bg-white border-r p-6 overflow-y-auto shadow-xl z-10">
        <div class="flex items-center gap-3 mb-8 border-b-4 border-blue-600 pb-4">
            <div class="bg-blue-600 p-3 rounded-xl text-white font-black text-2xl">STC</div>
            <h1 class="text-2xl font-black text-slate-800 tracking-tighter">購買部 経営管理システム</h1>
        </div>

        <!-- 1. 部門選択・PDF読込 -->
        <div class="mb-8 space-y-4">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest">1. 部門・データ連携</h2>
            <div class="grid grid-cols-3 gap-2" id="deptTabs">
                <button onclick="changeDept('koubai')" id="tab-koubai" class="py-2 text-xs font-bold border-2 rounded-xl active-tab transition-all">購買課管理</button>
                <button onclick="changeDept('shikaku')" id="tab-shikaku" class="py-2 text-xs font-bold border-2 rounded-xl transition-all">資格教育</button>
                <button onclick="changeDept('total')" id="tab-total" class="py-2 text-xs font-bold border-2 rounded-xl transition-all bg-slate-50 italic">部門合計</button>
            </div>
            <button id="pdfUploadBtn" class="w-full bg-blue-50 border-2 border-blue-200 text-blue-700 py-4 rounded-2xl font-black hover:bg-blue-100 transition-all flex items-center justify-center gap-3">
                <span class="text-2xl">📄</span> PDF損益計算書を読み込む
            </button>
        </div>

        <!-- 2. STC講習人数入力（資格教育のみ表示） -->
        <div id="stcInputArea" class="mb-8 p-6 bg-slate-800 rounded-3xl text-white hidden">
            <h3 class="font-black mb-4 flex justify-between items-center text-lg">
                <span>STC 講習人数入力</span>
                <span id="stcMonthLabel" class="text-sm font-normal text-slate-400">5月度</span>
            </h3>
            <table class="w-full text-sm stc-table">
                <tr class="opacity-60"><th>項目</th><th>今月</th><th>累計</th></tr>
                <tr><td class="py-1">玉掛</td><td><input type="number" class="stc-val-m" id="m_t"></td><td><input type="number" class="stc-val-c" id="c_t"></td></tr>
                <tr><td class="py-1">クレーン</td><td><input type="number" class="stc-val-m" id="m_c"></td><td><input type="number" class="stc-val-c" id="c_c"></td></tr>
                <tr><td class="py-1">フォーク</td><td><input type="number" class="stc-val-m" id="m_f"></td><td><input type="number" class="stc-val-c" id="c_f"></td></tr>
                <tr class="border-t border-slate-600 font-bold">
                    <td class="pt-2">合計 (Q)</td><td id="stc_m_total" class="pt-2">0</td><td id="stc_c_total" class="pt-2 text-blue-400 text-xl">0</td>
                </tr>
            </table>
        </div>

        <!-- 3. 数値詳細編集 -->
        <div class="space-y-4">
            <h2 class="text-xs font-bold text-slate-400 uppercase tracking-widest">2. 数値詳細 (PDF反映値)</h2>
            <div class="grid grid-cols-1 gap-4 bg-slate-50 p-6 rounded-3xl border-2 border-slate-200">
                <div><label class="text-xs font-bold text-slate-500 block mb-1">PQ 売上高(累計)</label><input type="number" id="inPQ" class="w-full text-2xl font-black bg-transparent outline-none"></div>
                <div><label class="text-xs font-bold text-slate-500 block mb-1">VQ 変動費(累計)</label><input type="number" id="inVQ" class="w-full text-2xl font-black bg-transparent outline-none"></div>
                <div><label class="text-xs font-bold text-slate-500 block mb-1">F 固定費(累計)</label><input type="number" id="inF" class="w-full text-2xl font-black bg-transparent outline-none"></div>
            </div>
            <button onclick="saveData()" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black text-xl shadow-xl hover:scale-[1.02] active:scale-[0.98] transition-all mt-4">クラウドに保存</button>
            <p id="statusMsg" class="text-center font-bold text-blue-600 mt-2"></p>
        </div>
    </aside>

    <!-- メイン表示 -->
    <main class="flex-1 overflow-y-auto p-10">
        <div class="max-w-5xl mx-auto space-y-10">
            <div class="flex justify-between items-end">
                <div>
                    <h2 class="text-5xl font-black text-slate-900" id="displayDeptName">購買課管理</h2>
                    <div class="flex gap-4 mt-4">
                        <select id="selectYear" class="bg-white border-2 border-slate-300 rounded-xl p-2 font-bold">
                            <option value="2025">2024年度 (2506期)</option>
                            <option value="2024">2023年度 (2406期)</option>
                        </select>
                        <select id="selectMonth" class="bg-white border-2 border-slate-300 rounded-xl p-2 font-bold">
                            <option value="05">5月度</option>
                            <option value="06">6月度(決算)</option>
                        </select>
                    </div>
                </div>
                <div class="bg-blue-600 p-8 rounded-[40px] shadow-2xl text-white min-w-[280px] text-right">
                    <p class="text-xs font-bold opacity-70 uppercase tracking-widest">Cumulative Profit</p>
                    <p class="text-5xl font-black" id="totalG">¥0</p>
                </div>
            </div>

            <div class="bg-white p-12 rounded-[50px] shadow-sm border-2 border-slate-100 flex flex-col items-center relative">
                <div class="absolute top-10 right-10 text-right">
                    <p class="text-sm font-bold text-slate-400">MQ Ratio</p>
                    <p class="text-4xl font-black text-blue-600"><span id="outMQRate">0</span>%</p>
                </div>
                <div class="mq-visual-container">
                    <div class="mq-box box-pq"><span class="label">PQ 売上</span><span class="value" id="dPQ">0</span></div>
                    <div class="mq-box box-vq"><span class="label text-red-500">VQ 変動費</span><span class="value text-red-500" id="dVQ">0</span></div>
                    <div class="mq-box box-mq"><span class="label text-blue-600">MQ 付加価値</span><span class="value text-blue-600" id="dMQ">0</span></div>
                    <div class="mq-box box-f"><span class="label">F 固定費</span><span class="value" id="dF">0</span></div>
                    <div class="mq-box box-g"><span class="label text-green-600">G 利益</span><span class="value text-green-600" id="dG">0</span></div>
                </div>

                <div class="mt-12 flex items-center gap-6">
                    <div id="pvmq-view" class="flex gap-4 items-center bg-slate-50 p-6 rounded-3xl border-2 border-dashed border-slate-200">
                        <div class="text-center"><p class="text-xs font-bold text-slate-400 uppercase">P (単価)</p><p id="vP" class="text-2xl font-black">0</p></div>
                        <div class="text-slate-300 text-xl font-bold">-</div>
                        <div class="text-center"><p class="text-xs font-bold text-slate-400 uppercase">V (変動)</p><p id="vV" class="text-2xl font-black text-red-500">0</p></div>
                        <div class="text-slate-300 text-xl font-bold">×</div>
                        <div class="text-center bg-blue-600 text-white px-6 py-2 rounded-2xl"><p class="text-xs font-bold opacity-80 uppercase">Q (累計数量)</p><p id="vQ" class="text-3xl font-black">0</p></div>
                    </div>
                </div>
            </div>
            
            <div class="bg-white p-10 rounded-[40px] shadow-sm border-2 border-slate-100 h-[350px]">
                <canvas id="stackedChart"></canvas>
            </div>
        </div>
    </main>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAvK-_h5NzDJcyPDJgb-iddYdscYaUivto",
        authDomain: "mq-accounting-221b3.firebaseapp.com",
        projectId: "mq-accounting-221b3",
        storageBucket: "mq-accounting-221b3.firebasestorage.app",
        messagingSenderId: "684182333946",
        appId: "1:684182333946:web:b9406d2ee2ceb838211c43"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let currentDept = "koubai";
    let currentYear = "2025";
    let currentMonth = "05";
    let allData = {};

    const ctx = document.getElementById('stackedChart').getContext('2d');
    const chart = new Chart(ctx, {
        type: 'bar',
        data: { labels: ['購買課管理', '資格教育', '部門合計'], datasets: [
            { label: '利益(G)', data: [0,0,0], backgroundColor: '#dcfce7' },
            { label: '固定費(F)', data: [0,0,0], backgroundColor: '#fffbeb' },
            { label: '変動費(VQ)', data: [0,0,0], backgroundColor: '#fef2f2' }
        ]},
        options: { responsive: true, maintainAspectRatio: false, scales: { x: { stacked: true }, y: { stacked: true } } }
    });

    onSnapshot(doc(db, "mq_system_v3", "master"), (docSnap) => {
        if (docSnap.exists()) {
            allData = docSnap.data();
            refresh();
        }
    });

    window.refresh = function() {
        const key = `${currentYear}-${currentMonth}`;
        if(!allData[key]) allData[key] = { koubai:{pq:0,vq:0,f:0}, shikaku:{pq:0,vq:0,f:0,q_c:0}, total:{pq:0,vq:0,f:0} };
        
        const data = allData[key][currentDept];
        document.getElementById('inPQ').value = data.pq || 0;
        document.getElementById('inVQ').value = data.vq || 0;
        document.getElementById('inF').value = data.f || 0;

        // STCエリア表示切替
        document.getElementById('stcInputArea').style.display = (currentDept === 'shikaku' ? 'block' : 'none');
        const qc = data.q_c || 0;

        const mq = (data.pq || 0) - (data.vq || 0);
        const g = mq - (data.f || 0);
        
        document.getElementById('dPQ').innerText = (data.pq || 0).toLocaleString();
        document.getElementById('dVQ').innerText = (data.vq || 0).toLocaleString();
        document.getElementById('dMQ').innerText = mq.toLocaleString();
        document.getElementById('dF').innerText = (data.f || 0).toLocaleString();
        document.getElementById('dG').innerText = g.toLocaleString();
        document.getElementById('totalG').innerText = '¥' + g.toLocaleString();
        document.getElementById('outMQRate').innerText = data.pq > 0 ? Math.round((mq/data.pq)*100) : 0;

        // PVMQ
        document.getElementById('vQ').innerText = qc.toLocaleString();
        document.getElementById('vP').innerText = qc > 0 ? Math.round(data.pq / qc).toLocaleString() : 0;
        document.getElementById('vV').innerText = qc > 0 ? Math.round(data.vq / qc).toLocaleString() : 0;

        // グラフ
        ['koubai', 'shikaku', 'total'].forEach((d, i) => {
            const row = allData[key][d] || {pq:0, vq:0, f:0};
            chart.data.datasets[0].data[i] = (row.pq - row.vq) - row.f;
            chart.data.datasets[1].data[i] = row.f;
            chart.data.datasets[2].data[i] = row.vq;
        });
        chart.update();
    }

    window.changeDept = (dept) => {
        currentDept = dept;
        document.querySelectorAll('#deptTabs button').forEach(b => b.classList.remove('active-tab'));
        document.getElementById('tab-' + dept).classList.add('active-tab');
        document.getElementById('displayDeptName').innerText = (dept==='koubai'?'121 購買課管理':dept==='shikaku'?'122 資格教育':'12 部門合計');
        refresh();
    }

    window.saveData = async () => {
        const key = `${currentYear}-${currentMonth}`;
        const qc = parseInt(document.getElementById('c_t').value || 0) + parseInt(document.getElementById('c_c').value || 0) + parseInt(document.getElementById('c_f').value || 0);
        
        allData[key][currentDept] = {
            pq: parseInt(document.getElementById('inPQ').value) || 0,
            vq: parseInt(document.getElementById('inVQ').value) || 0,
            f: parseInt(document.getElementById('inF').value) || 0,
            q_c: qc
        };
        await setDoc(doc(db, "mq_system_v3", "master"), allData);
        alert("保存完了！");
    }

    // STC連動
    document.querySelectorAll('.stc-val-m, .stc-val-c').forEach(el => {
        el.oninput = () => {
            const mt = parseInt(document.getElementById('m_t').value || 0) + parseInt(document.getElementById('m_c').value || 0) + parseInt(document.getElementById('m_f').value || 0);
            const ct = parseInt(document.getElementById('c_t').value || 0) + parseInt(document.getElementById('c_c').value || 0) + parseInt(document.getElementById('c_f').value || 0);
            document.getElementById('stc_m_total').innerText = mt;
            document.getElementById('stc_c_total').innerText = ct;
            document.getElementById('vQ').innerText = ct; // 累計Qに反映
        }
    });

    document.getElementById('pdfUploadBtn').onclick = () => alert("AI連携準備中。周末にGPT-4o APIの設定を行い、PDFから数値を自動抽出できるようにします。");

    refresh();
</script>
</body>
</html>
