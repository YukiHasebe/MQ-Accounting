<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQ会計ダッシュボード - 株式会社コプロス</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root { --p: #1e40af; --s: #10b981; --d: #ef4444; --bg: #f3f4f6; --c: #ffffff; --b: #1f2937; }
        body { font-family: "Hiragino Sans", "Meiryo", sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .container { max-width: 1800px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; background: var(--c); padding: 15px 30px; border-radius: 12px; border-bottom: 5px solid var(--p); margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .controls { display: flex; gap: 10px; }
        select, .btn-csv { padding: 10px; border-radius: 8px; border: 1px solid #d1d5db; font-weight: bold; cursor: pointer; }
        .btn-csv { background: var(--p); color: white; border: none; }
        .dashboard-grid { display: grid; grid-template-columns: 420px 1fr 450px; gap: 20px; }
        .card { background: var(--c); border-radius: 15px; padding: 20px; border: 1px solid #e5e7eb; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .tabs { display: flex; gap: 5px; margin-bottom: 10px; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: #e5e7eb; cursor: pointer; font-weight: bold; border-radius: 8px; }
        .tab-btn.active { background: var(--p); color: white; }
        .pl-scroll { height: 600px; overflow-y: auto; border: 1px solid #e5e7eb; background: #fff; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 11px; }
        td { padding: 8px 5px; border-bottom: 1px solid #f3f4f6; }
        input[type="number"] { width: 90%; border: 1px solid #d1d5db; padding: 4px; border-radius: 4px; text-align: right; font-weight: bold; }
        .tag { font-size: 9px; padding: 2px 4px; border-radius: 3px; font-weight: bold; margin-right: 4px; display: inline-block; width: 35px; text-align: center; }
        .tag-p { background: #dbeafe; color: #1e40af; } .tag-v { background: #fee2e2; color: #b91c1c; } .tag-f { background: #f3f4f6; color: #475569; }
        .mq-table { display: grid; grid-template-columns: 180px 120px 180px; grid-template-rows: repeat(3, 100px); border: 4px solid var(--b); background: white; margin: 20px auto; }
        .mq-c { border: 1px solid var(--b); display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .mq-c strong { font-size: 1.4rem; font-weight: 900; }
        .btn-sync { background: var(--s); color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .kpi-row { display: flex; gap: 20px; justify-content: center; width: 100%; }
        .kpi-box { background: #f8fafc; border: 2px solid var(--p); padding: 10px 30px; border-radius: 12px; text-align: center; min-width: 180px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>MQ会計ダッシュボード</h1>
        <div class="controls">
            <select id="monthSel" onchange="calculate()"><option value="3">3月</option></select>
            <button class="btn-csv" onclick="document.getElementById('csvIn').click()">CSVインポート</button>
            <input type="file" id="csvIn" style="display:none" accept=".csv">
        </div>
    </header>

    <div class="dashboard-grid">
        <section>
            <div class="tabs">
                <button class="tab-btn active" onclick="setDept('121', this)">121 購買課</button>
                <button class="tab-btn" onclick="setDept('122', this)">122 資格教育</button>
                <button class="tab-btn" onclick="setDept('Total', this)">部門合計</button>
            </div>
            <div class="card">
                <div class="pl-scroll"><table><tbody id="pl-body"></tbody></table></div>
                <button class="btn-sync" id="save-label" onclick="syncToFirebase()">購買課をクラウド保存</button>
            </div>
        </section>

        <section style="display:flex; flex-direction:column; align-items:center;">
            <div class="kpi-row">
                <div class="kpi-box"><span>MQ比率</span><strong id="id-ratio">0.0%</strong></div>
                <div class="kpi-box"><span>損益分岐点</span><strong id="id-be">¥0</strong></div>
            </div>
            <div class="mq-table">
                <div class="mq-c" style="grid-row:span 3; background:#f0f7ff;"><span>売上 PQ</span><strong id="m-pq">0</strong></div>
                <div class="mq-c" style="grid-column:span 2; background:#fff1f2;"><span>変動費 VQ</span><strong id="m-vq" style="color:var(--d)">0</strong></div>
                <div class="mq-c" style="grid-row:span 2; background:#ffffff;"><span>付加価値 MQ</span><strong id="m-mq">0</strong></div>
                <div class="mq-c" style="background:#f9fafb;"><span>固定費 F</span><strong id="m-f">0</strong></div>
                <div class="mq-c" id="g-box"><span>利益 G</span><strong id="m-g">0</strong></div>
            </div>
            <!-- PVMQ図省略（レイアウト維持） -->
        </section>
        <section><div class="card"><canvas id="stChart" height="280"></canvas></div><div class="card" style="margin-top:20px;"><canvas id="prChart" height="230"></canvas></div></section>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyAvK-_h5NzDjCYPdJgb-iddYdscYaUivto", authDomain: "mq-accounting-221b3.firebaseapp.com", projectId: "mq-accounting-221b3", storageBucket: "mq-accounting-221b3.appspot.com", messagingSenderId: "684182333946", appId: "1:684182333946:web:b9406d2ee2ceb8382b11c43" };
    firebase.initializeApp(firebaseConfig); const db = firebase.firestore();

    const masterAccounts = [
        { name: "兼業事業売上高", type: "売上" }, { name: "内部振替収入", type: "売上" }, { name: "材料費", type: "変動" },
        { name: "安全費", type: "固定" }, { name: "技術管理費", type: "固定" }, { name: "機械等経費", type: "固定" },
        { name: "従業員給料手当", type: "固定" }, { name: "燃料費", type: "固定" }, { name: "法定福利費", type: "固定" }
    ];

    let currentDept = '121', dbData = {}, charts = {};

    document.getElementById('csvIn').addEventListener('change', function(e) {
        const reader = new FileReader();
        reader.onload = (ev) => { 
            const text = ev.target.result;
            const lines = text.split('\n');
            let count = 0;

            lines.forEach(line => {
                // 行の中にある「数字」だけをすべて抽出（カンマを除去してから）
                const numbers = line.replace(/,/g, '').match(/-?\d+/g) || [];
                // 科目名マスタと照合
                const match = masterAccounts.find(a => line.includes(a.name));
                
                if (match && numbers.length >= 6) {
                    // CSV構造: [?, ?, ..., 121発生, 121累計, 122発生, 122累計, 合計発生, 合計累計]
                    // 後ろから数えるのが最も確実
                    const len = numbers.length;
                    dbData[`2025-3-121-${match.name}`] = parseInt(numbers[len-6]) || 0;
                    dbData[`2025-3-122-${match.name}`] = parseInt(numbers[len-4]) || 0;
                    dbData[`2025-3-Total-${match.name}`] = parseInt(numbers[len-2]) || 0;
                    count++;
                }
            });

            if(count > 0) {
                alert(`${count}件の科目を解析・反映しました。`);
                calculate();
            } else {
                alert("科目を検出できませんでした。CSVの形式を確認してください。");
            }
        };
        reader.readAsText(e.target.files[0]);
    });

    async function syncToFirebase() {
        const y = "2025", m = "3";
        const filtered = {}; masterAccounts.forEach(a => filtered[a.name] = dbData[`${y}-${m}-${currentDept}-${a.name}`] || 0);
        try { await db.collection("accounting").doc(`${y}-${m}-${currentDept}`).set({ values: filtered, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }); alert("クラウド保存成功！"); } 
        catch (e) { alert("保存失敗: " + e.message); }
    }

    function setDept(id, btn) {
        currentDept = id; document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active');
        document.getElementById('save-label').innerText = `${btn.innerText}をクラウド保存`; calculate();
    }

    function calculate() {
        const y = "2025", m = "3";
        let pq = 0, vq = 0, f = 0; const plBody = document.getElementById('pl-body'); plBody.innerHTML = '';
        masterAccounts.forEach(acc => {
            let val = dbData[`${y}-${m}-${currentDept}-${acc.name}`] || 0;
            if(acc.type === "売上") pq += val; else if(acc.type === "変動") vq += val; else f += val;
            const tag = acc.type === "売上" ? "tag-p" : (acc.type === "変動" ? "tag-v" : "tag-f");
            plBody.innerHTML += `<tr><td><span class="tag ${tag}">${acc.type}</span>${acc.name}</td><td style="text-align:right;"><input type="number" value="${val}" onchange="dbData['${y}-${m}-${currentDept}-${acc.name}']=parseInt(this.value);calculate();"></td></tr>`;
        });
        const mq = pq - vq, g = mq - f, ratio = pq > 0 ? (mq / pq) * 100 : 0, be = ratio > 0 ? Math.round(f / (ratio / 100)) : 0;
        document.getElementById('m-pq').innerText = pq.toLocaleString(); document.getElementById('m-vq').innerText = vq.toLocaleString();
        document.getElementById('m-mq').innerText = mq.toLocaleString(); document.getElementById('m-f').innerText = f.toLocaleString();
        document.getElementById('m-g').innerText = g.toLocaleString(); document.getElementById('g-box').style.background = g >= 0 ? '#ecfdf5' : '#fef2f2';
        document.getElementById('id-ratio').innerText = ratio.toFixed(1) + "%"; document.getElementById('id-be').innerText = "¥" + be.toLocaleString();
        updateCharts(pq, vq, f, g);
    }

    function updateCharts(pq, vq, f, g) {
        if(charts.st) charts.st.destroy();
        charts.st = new Chart(document.getElementById('stChart'), { type: 'bar', data: { labels: ['2022','2023','2024','今期'], datasets: [{label:'利益(G)',data:[1187054,631692,1310425,g],backgroundColor:'#60a5fa'},{label:'固定費(F)',data:[540000,600000,540000,f],backgroundColor:'#f472b6'},{label:'変動費(VQ)',data:[1102479,1117585,1355990,vq],backgroundColor:'#3b82f6'}]}, options: { responsive: true, scales: { x: { stacked: true }, y: { stacked: true } } } });
        if(charts.pr) charts.pr.destroy();
        charts.pr = new Chart(document.getElementById('prChart'), { type: 'line', data: { labels: ['2022','2023','2024','今期'], datasets: [{label:'利益トレンド',data:[1187054,631692,1310425,g],borderColor:'#059669',tension:0.1}]}, options: { responsive: true } });
    }
    calculate();
</script>

</body>
</html>
